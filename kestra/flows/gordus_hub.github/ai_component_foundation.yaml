id: ai_component_foundation
namespace: gordus_hub.github
description: >
  Governance-bound preflight for the three-library runtime foundation.
  This flow records contract and package-smoke-test boundaries only.
tasks:
  - id: declare_three_library_boundary
    type: io.kestra.plugin.core.log.Log
    message: >
      ACTIVE_LIBRARIES=ARGOS_TRANSLATE,CLTK,INSPECT_AI;
      WIRING=PREPARED_FAIL_CLOSED;
      CI_PACKAGE_INSTALLS=DISPOSABLE_VENVS_ONLY;
      PERSISTENT_INSTALLATION=NOT_AUTHORIZED;
      ARGOS_LANGUAGE_PACKAGES=NOT_DOWNLOADED;
      CLTK_LANGUAGE_RESOURCES=NOT_DOWNLOADED;
      INSPECT_AI_SUITES=NOT_APPROVED;
      MODEL_WEIGHTS=NOT_DOWNLOADED;
      CERTIFICATION=NOT_GRANTED.
  - id: declare_required_gates
    type: io.kestra.plugin.core.log.Log
    message: >
      Translation remains blocked until direct Argos pair artifacts are approved and locally installed.
      CLTK analysis remains blocked until local language resources and file hashes/licenses are approved.
      Inspect AI evaluation remains blocked until task suites, dataset provenance, scoring contracts
      and model/network boundaries are reviewed. This flow does not certify task-level operation.
