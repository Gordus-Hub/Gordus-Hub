name: Mojo toolchain validation

on:
  pull_request:
    paths:
      - "toolchains/mojo/**"
      - ".github/workflows/mojo-toolchain.yml"
  push:
    branches: ["main"]
    paths:
      - "toolchains/mojo/**"
      - ".github/workflows/mojo-toolchain.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mojo-toolchain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pins-preflight:
    name: Validate Mojo/pixi pins, lock and isolation (fail-closed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13 (stdlib only, for the validator)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate components.json against Dockerfile, pixi.toml and pixi.lock
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/mojo-evidence"
          python toolchains/mojo/scripts/validate_mojo_toolchain.py --repo-root . --report "$RUNNER_TEMP/mojo-evidence/mojo-preflight.json"
          python -c 'import json, os; p=json.load(open(os.environ["RUNNER_TEMP"] + "/mojo-evidence/mojo-preflight.json")); assert p["result"] == "PASS", p; assert p["certification"] == "NOT_GRANTED"'
          sh -n toolchains/mojo/tests/test_mojo_toolchain.sh

  image-smoke-and-kestra:
    name: Build Debian 13 Mojo image, run/build Mojo, gate in Kestra
    needs: pins-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build isolated Mojo toolchain image (pixi SHA-256 + pixi install --locked)
        run: docker build --pull --file toolchains/mojo/Dockerfile --tag gordus-mojo:ci .

      - name: Run mojo run / mojo build / Python interop inside the image (offline)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/mojo-evidence"
          docker run --rm --network none gordus-mojo:ci sh /opt/gordus-mojo/tests/test_mojo_toolchain.sh | tee "$RUNNER_TEMP/mojo-evidence/smoke.txt"
          docker run --rm gordus-mojo:ci sh -c 'test "$(id -un)" = mojo && test "$MOJO_ENV" = /opt/mojo/env/.pixi/envs/default && ! ls /usr/bin/python3 2>/dev/null && ! touch /opt/gordus-mojo/probe 2>/dev/null && ! touch "$MOJO_ENV/probe" 2>/dev/null'
          smoke="$RUNNER_TEMP/mojo-evidence/smoke.txt"
          {
            printf 'MOJO_VERSION_LINE=%s\n' "$(grep -m1 '^Mojo ' "$smoke")"
            printf 'HOLA_OUTPUT=%s\n' "$(grep -m1 '^Hola, ' "$smoke")"
            if grep -q '^binario OK: ' "$smoke"; then echo 'BINARY_RESULT=PASS'; else echo 'BINARY_RESULT=FAIL'; fi
            printf 'INTEROP_RESULT=%s\n' "$(grep -m1 '^python_prefix: ' "$smoke")"
            if grep -q '^PASS: toolchain Mojo ' "$smoke"; then echo 'SMOKE_RESULT=PASS'; else echo 'SMOKE_RESULT=FAIL'; fi
          } >> "$GITHUB_ENV"

      - name: Generate a one-run Kestra test credential
        shell: bash
        run: |
          set -euo pipefail
          password="KCI$(openssl rand -hex 24)A9!"
          echo "::add-mask::$password"
          printf 'KESTRA_TEST_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"

      - name: Start ephemeral pinned Kestra engine
        shell: bash
        run: |
          set -euo pipefail
          docker pull kestra/kestra:v1.3.40-slim
          configuration="$(printf 'kestra:\n  server:\n    basicAuth:\n      username: "admin@kestra.io"\n      password: "%s"\n' "$KESTRA_TEST_PASSWORD")"
          docker run -d --name kestra-mojo-smoke -p 127.0.0.1:8080:8080 \
            -e KESTRA_CONFIGURATION="$configuration" \
            kestra/kestra:v1.3.40-slim server local
          for attempt in $(seq 1 36); do
            if ! docker inspect -f '{{.State.Running}}' kestra-mojo-smoke 2>/dev/null | grep -qx true; then
              docker logs kestra-mojo-smoke || true; exit 1
            fi
            if curl --location --fail --silent http://127.0.0.1:8080/ >/dev/null; then echo "Kestra API is ready."; exit 0; fi
            sleep 5
          done
          echo "Kestra API did not become ready."; docker logs kestra-mojo-smoke || true; exit 1

      - name: Import Mojo toolchain flow and require SUCCESS with observed results
        shell: bash
        run: |
          set -euo pipefail
          auth="admin@kestra.io:$KESTRA_TEST_PASSWORD"
          curl --fail --silent --show-error --user "$auth" -X POST -H "Content-Type: application/x-yaml" \
            --data-binary @toolchains/mojo/kestra/mojo_toolchain_smoke.yaml \
            http://127.0.0.1:8080/api/v1/main/flows -o /tmp/kestra-mojo-import.json
          jq -e '.id == "mojo_toolchain_smoke" and .namespace == "gordus_hub.toolchains"' /tmp/kestra-mojo-import.json
          response="$(curl --fail --silent --show-error --user "$auth" -X POST \
            -F "mojo_version_line=$MOJO_VERSION_LINE" -F "hola_output=$HOLA_OUTPUT" \
            -F "binary_result=$BINARY_RESULT" -F "interop_result=$INTEROP_RESULT" \
            -F "smoke_result=$SMOKE_RESULT" \
            http://127.0.0.1:8080/api/v1/main/executions/gordus_hub.toolchains/mojo_toolchain_smoke)"
          execution_id="$(printf '%s' "$response" | jq -r '.id // empty')"
          test -n "$execution_id"
          for attempt in $(seq 1 60); do
            status_json="$(curl --fail --silent --show-error --user "$auth" "http://127.0.0.1:8080/api/v1/main/executions/$execution_id")"
            state="$(printf '%s' "$status_json" | jq -r '.state.current // empty')"
            echo "Mojo toolchain execution $execution_id state: $state"
            case "$state" in
              SUCCESS) exit 0 ;;
              FAILED|WARNING|KILLING|KILLED|CANCELLED) echo "$status_json"; exit 1 ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for Mojo toolchain flow execution $execution_id."; exit 1

      - name: Upload Mojo toolchain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mojo-toolchain-evidence
          path: ${{ runner.temp }}/mojo-evidence
          if-no-files-found: warn

      - name: Print Kestra logs on failure
        if: failure()
        run: docker logs kestra-mojo-smoke || true

      - name: Stop ephemeral Kestra engine
        if: always()
        run: docker rm -f kestra-mojo-smoke || true
