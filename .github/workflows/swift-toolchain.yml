name: Swift toolchain validation

on:
  pull_request:
    paths:
      - "toolchains/swift/**"
      - ".github/workflows/swift-toolchain.yml"
  push:
    branches: ["main"]
    paths:
      - "toolchains/swift/**"
      - ".github/workflows/swift-toolchain.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-toolchain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pins-preflight:
    name: Validate Swift pins, signatures, environment and isolation (fail-closed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13 (stdlib only, for the validator)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate components.json against Dockerfile pins
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/swift-evidence"
          python toolchains/swift/scripts/validate_swift_toolchain.py --repo-root . --report "$RUNNER_TEMP/swift-evidence/swift-preflight.json"
          python -c 'import json, os; p=json.load(open(os.environ["RUNNER_TEMP"] + "/swift-evidence/swift-preflight.json")); assert p["result"] == "PASS", p; assert p["certification"] == "NOT_GRANTED"'
          sh -n toolchains/swift/tests/test_swift_toolchain.sh

  image-smoke-and-kestra:
    name: Build Debian 13 Swift image, swiftc + swift build/run/test, gate in Kestra
    needs: pins-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build isolated Swift toolchain image (SHA-256 + GPG verified inside)
        run: docker build --pull --file toolchains/swift/Dockerfile --tag gordus-swift:ci .

      - name: Run swiftc and swift build/run/test inside the image (offline)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/swift-evidence"
          docker run --rm --network none gordus-swift:ci sh /opt/gordus-swift/tests/test_swift_toolchain.sh | tee "$RUNNER_TEMP/swift-evidence/smoke.txt"
          docker run --rm gordus-swift:ci sh -c 'test "$(id -un)" = swiftuser && test "$GORDUS_SWIFT_OFFLINE" = true && ! command -v python3 && ! command -v curl && ! command -v git && ! command -v lldb && ! touch /opt/gordus-swift/probe 2>/dev/null && ! touch /opt/swift/probe 2>/dev/null'
          docker image inspect gordus-swift:ci --format '{{.Size}}' > "$RUNNER_TEMP/swift-evidence/image-size-bytes.txt"
          smoke="$RUNNER_TEMP/swift-evidence/smoke.txt"
          {
            printf 'SWIFTC_VERSION_LINE=%s\n' "$(grep -m1 '^Swift version ' "$smoke")"
            printf 'SWIFTPM_VERSION_LINE=%s\n' "$(grep -m1 '^swiftpm: ' "$smoke")"
            printf 'HOLA_OUTPUT=%s\n' "$(grep -m1 '^Hola, ' "$smoke")"
            if grep -qE 'Executed 3 tests, with 0 failures' "$smoke"; then echo 'TEST_RESULT=PASS'; else echo 'TEST_RESULT=FAIL'; fi
            if grep -q '^PASS: toolchain Swift ' "$smoke"; then echo 'SMOKE_RESULT=PASS'; else echo 'SMOKE_RESULT=FAIL'; fi
          } >> "$GITHUB_ENV"

      - name: Generate a one-run Kestra test credential
        shell: bash
        run: |
          set -euo pipefail
          password="KCI$(openssl rand -hex 24)A9!"
          echo "::add-mask::$password"
          printf 'KESTRA_TEST_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"

      - name: Start ephemeral pinned Kestra engine
        shell: bash
        run: |
          set -euo pipefail
          docker pull kestra/kestra:v1.3.40-slim
          configuration="$(printf 'kestra:\n  server:\n    basicAuth:\n      username: "admin@kestra.io"\n      password: "%s"\n' "$KESTRA_TEST_PASSWORD")"
          docker run -d --name kestra-swift-smoke -p 127.0.0.1:8080:8080 \
            -e KESTRA_CONFIGURATION="$configuration" \
            kestra/kestra:v1.3.40-slim server local
          for attempt in $(seq 1 36); do
            if ! docker inspect -f '{{.State.Running}}' kestra-swift-smoke 2>/dev/null | grep -qx true; then
              docker logs kestra-swift-smoke || true; exit 1
            fi
            if curl --location --fail --silent http://127.0.0.1:8080/ >/dev/null; then echo "Kestra API is ready."; exit 0; fi
            sleep 5
          done
          echo "Kestra API did not become ready."; docker logs kestra-swift-smoke || true; exit 1

      - name: Import Swift toolchain flow and require SUCCESS with observed results
        shell: bash
        run: |
          set -euo pipefail
          auth="admin@kestra.io:$KESTRA_TEST_PASSWORD"
          curl --fail --silent --show-error --user "$auth" -X POST -H "Content-Type: application/x-yaml" \
            --data-binary @toolchains/swift/kestra/swift_toolchain_smoke.yaml \
            http://127.0.0.1:8080/api/v1/main/flows -o /tmp/kestra-swift-import.json
          jq -e '.id == "swift_toolchain_smoke" and .namespace == "gordus_hub.toolchains"' /tmp/kestra-swift-import.json
          response="$(curl --fail --silent --show-error --user "$auth" -X POST \
            -F "swiftc_version_line=$SWIFTC_VERSION_LINE" -F "swiftpm_version_line=$SWIFTPM_VERSION_LINE" \
            -F "hola_output=$HOLA_OUTPUT" -F "test_result=$TEST_RESULT" \
            -F "smoke_result=$SMOKE_RESULT" \
            http://127.0.0.1:8080/api/v1/main/executions/gordus_hub.toolchains/swift_toolchain_smoke)"
          execution_id="$(printf '%s' "$response" | jq -r '.id // empty')"
          test -n "$execution_id"
          for attempt in $(seq 1 60); do
            status_json="$(curl --fail --silent --show-error --user "$auth" "http://127.0.0.1:8080/api/v1/main/executions/$execution_id")"
            state="$(printf '%s' "$status_json" | jq -r '.state.current // empty')"
            echo "Swift toolchain execution $execution_id state: $state"
            case "$state" in
              SUCCESS) exit 0 ;;
              FAILED|WARNING|KILLING|KILLED|CANCELLED) echo "$status_json"; exit 1 ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for Swift toolchain flow execution $execution_id."; exit 1

      - name: Upload Swift toolchain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-toolchain-evidence
          path: ${{ runner.temp }}/swift-evidence
          if-no-files-found: warn

      - name: Print Kestra logs on failure
        if: failure()
        run: docker logs kestra-swift-smoke || true

      - name: Stop ephemeral Kestra engine
        if: always()
        run: docker rm -f kestra-swift-smoke || true
