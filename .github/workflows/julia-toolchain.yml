name: Julia toolchain validation

on:
  pull_request:
    paths:
      - "toolchains/julia/**"
      - ".github/workflows/julia-toolchain.yml"
  push:
    branches: ["main"]
    paths:
      - "toolchains/julia/**"
      - ".github/workflows/julia-toolchain.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: julia-toolchain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pins-preflight:
    name: Validate Julia pins, signatures, security floor and isolation (fail-closed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13 (stdlib only, for the validator)
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate components.json against Dockerfile pins
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/julia-evidence"
          python toolchains/julia/scripts/validate_julia_toolchain.py --repo-root . --report "$RUNNER_TEMP/julia-evidence/julia-preflight.json"
          python -c 'import json, os; p=json.load(open(os.environ["RUNNER_TEMP"] + "/julia-evidence/julia-preflight.json")); assert p["result"] == "PASS", p; assert p["certification"] == "NOT_GRANTED"'
          sh -n toolchains/julia/tests/test_julia_toolchain.sh

  image-smoke-and-kestra:
    name: Build Debian 13 Julia image, julia + Pkg (offline) + Test, gate in Kestra
    needs: pins-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build isolated Julia toolchain image (checksums + GPG verified inside)
        run: docker build --pull --file toolchains/julia/Dockerfile --tag gordus-julia:ci .

      - name: Run julia, Pkg.instantiate and Pkg.test inside the image (offline)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/julia-evidence"
          docker run --rm --network none gordus-julia:ci sh /opt/gordus-julia/tests/test_julia_toolchain.sh | tee "$RUNNER_TEMP/julia-evidence/smoke.txt"
          docker run --rm gordus-julia:ci sh -c 'test "$(id -un)" = juliauser && test "$JULIA_PKG_OFFLINE" = true && test -z "$JULIA_PKG_SERVER" && julia --startup-file=no -e "exit(VERSION >= v\"1.13.2\" ? 0 : 3)" && ! command -v python3 && ! command -v curl && ! command -v wget && ! touch /opt/gordus-julia/probe 2>/dev/null && ! touch /opt/julia/probe 2>/dev/null'
          docker image inspect gordus-julia:ci --format '{{.Size}}' > "$RUNNER_TEMP/julia-evidence/image-size-bytes.txt"
          smoke="$RUNNER_TEMP/julia-evidence/smoke.txt"
          {
            printf 'JULIA_VERSION_LINE=%s\n' "$(grep -m1 '^julia [0-9]' "$smoke")"
            if grep -q '^parche de seguridad (>= 1.13.2): OK' "$smoke"; then echo 'SECURITY_PATCH=PASS'; else echo 'SECURITY_PATCH=FAIL'; fi
            printf 'PKG_VERSION_LINE=%s\n' "$(grep -m1 '^pkg [0-9]' "$smoke")"
            printf 'HOLA_OUTPUT=%s\n' "$(grep -m1 '^Hola, ' "$smoke")"
            if grep -q '^pkg test OK' "$smoke"; then echo 'TEST_RESULT=PASS'; else echo 'TEST_RESULT=FAIL'; fi
            if grep -q '^PASS: toolchain Julia ' "$smoke"; then echo 'SMOKE_RESULT=PASS'; else echo 'SMOKE_RESULT=FAIL'; fi
          } >> "$GITHUB_ENV"

      - name: Generate a one-run Kestra test credential
        shell: bash
        run: |
          set -euo pipefail
          password="KCI$(openssl rand -hex 24)A9!"
          echo "::add-mask::$password"
          printf 'KESTRA_TEST_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"

      - name: Start ephemeral pinned Kestra engine
        shell: bash
        run: |
          set -euo pipefail
          docker pull kestra/kestra:v1.3.40-slim
          configuration="$(printf 'kestra:\n  server:\n    basicAuth:\n      username: "admin@kestra.io"\n      password: "%s"\n' "$KESTRA_TEST_PASSWORD")"
          docker run -d --name kestra-julia-smoke -p 127.0.0.1:8080:8080 \
            -e KESTRA_CONFIGURATION="$configuration" \
            kestra/kestra:v1.3.40-slim server local
          for attempt in $(seq 1 36); do
            if ! docker inspect -f '{{.State.Running}}' kestra-julia-smoke 2>/dev/null | grep -qx true; then
              docker logs kestra-julia-smoke || true; exit 1
            fi
            if curl --location --fail --silent http://127.0.0.1:8080/ >/dev/null; then echo "Kestra API is ready."; exit 0; fi
            sleep 5
          done
          echo "Kestra API did not become ready."; docker logs kestra-julia-smoke || true; exit 1

      - name: Import Julia toolchain flow and require SUCCESS with observed results
        shell: bash
        run: |
          set -euo pipefail
          auth="admin@kestra.io:$KESTRA_TEST_PASSWORD"
          curl --fail --silent --show-error --user "$auth" -X POST -H "Content-Type: application/x-yaml" \
            --data-binary @toolchains/julia/kestra/julia_toolchain_smoke.yaml \
            http://127.0.0.1:8080/api/v1/main/flows -o /tmp/kestra-julia-import.json
          jq -e '.id == "julia_toolchain_smoke" and .namespace == "gordus_hub.toolchains"' /tmp/kestra-julia-import.json
          response="$(curl --fail --silent --show-error --user "$auth" -X POST \
            -F "julia_version=$JULIA_VERSION_LINE" -F "security_patch=$SECURITY_PATCH" \
            -F "pkg_version=$PKG_VERSION_LINE" \
            -F "hola_output=$HOLA_OUTPUT" -F "test_result=$TEST_RESULT" -F "smoke_result=$SMOKE_RESULT" \
            http://127.0.0.1:8080/api/v1/main/executions/gordus_hub.toolchains/julia_toolchain_smoke)"
          execution_id="$(printf '%s' "$response" | jq -r '.id // empty')"
          test -n "$execution_id"
          for attempt in $(seq 1 60); do
            status_json="$(curl --fail --silent --show-error --user "$auth" "http://127.0.0.1:8080/api/v1/main/executions/$execution_id")"
            state="$(printf '%s' "$status_json" | jq -r '.state.current // empty')"
            echo "Julia toolchain execution $execution_id state: $state"
            case "$state" in
              SUCCESS) exit 0 ;;
              FAILED|WARNING|KILLING|KILLED|CANCELLED) echo "$status_json"; exit 1 ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for Julia toolchain flow execution $execution_id."; exit 1

      - name: Upload Julia toolchain evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: julia-toolchain-evidence
          path: ${{ runner.temp }}/julia-evidence
          if-no-files-found: warn

      - name: Print Kestra logs on failure
        if: failure()
        run: docker logs kestra-julia-smoke || true

      - name: Stop ephemeral Kestra engine
        if: always()
        run: docker rm -f kestra-julia-smoke || true
