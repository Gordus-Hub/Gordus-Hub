name: AI component foundation validation

on:
  pull_request:
    paths:
      - "ai/**"
      - "scripts/ai/**"
      - "kestra/AI_COMPONENT_FOUNDATION.md"
      - "kestra/flows/**/*.yaml"
      - "kestra/flows/**/*.yml"
      - ".github/workflows/ai-component-foundation.yml"
      - ".github/workflows/kestra-runtime-smoke-test.yml"
  push:
    branches: ["main"]
    paths:
      - "ai/**"
      - "scripts/ai/**"
      - "kestra/AI_COMPONENT_FOUNDATION.md"
      - "kestra/flows/**/*.yaml"
      - "kestra/flows/**/*.yml"
      - ".github/workflows/ai-component-foundation.yml"
      - ".github/workflows/kestra-runtime-smoke-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-three-library-foundation-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_NO_CACHE_DIR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  manifest-and-contract-preflight:
    name: Validate three-library registry and fail-closed wiring
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4 tag
        with:
          persist-credentials: false

      - name: Set up Python 3.13 for manifest validation
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5 tag
        with:
          python-version: "3.13"

      - name: Validate active registry and retired component removal
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/gordus-ai-evidence"
          python scripts/ai/validate_components.py --repo-root . --report "$RUNNER_TEMP/gordus-ai-evidence/manifest-preflight.json"
          bash -n scripts/ai/preflight.sh
          bash -n scripts/ai/install_runtime.sh
          python -c 'from pathlib import Path; compile(Path("scripts/ai/validate_components.py").read_text(encoding="utf-8"), "scripts/ai/validate_components.py", "exec")'
          python -c 'import json, pathlib, os; p=json.loads(pathlib.Path(os.environ["RUNNER_TEMP"] + "/gordus-ai-evidence/manifest-preflight.json").read_text()); assert p["result"] == "PASS_PRECHECK_ONLY", p; assert p["certification"] == "NOT_GRANTED"; assert p["persistent_installation_performed"] is False; assert p["persistent_installation_ready_by_repository"] is False; assert p["active_components"] == ["argostranslate", "cltk", "inspect-ai"]'
          sha256sum ai/components.json ai/wiring.json ai/acquisition.json ai/translation/pairs.json ai/linguistics/resources.json ai/evaluation/suites.json ai/requirements/argos-translate.txt ai/requirements/cltk.txt ai/requirements/inspect-ai.txt ai/requirements/runtime.in ai/runtime/Dockerfile ai/runtime/tests/test_orchestrator.py ai/runtime/tests/test_install_guard.py scripts/ai/preflight.sh scripts/ai/validate_components.py scripts/ai/install_runtime.sh > "$RUNNER_TEMP/gordus-ai-evidence/source-sha256.txt"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/gordus-ai-evidence/git-sha.txt"
          python --version > "$RUNNER_TEMP/gordus-ai-evidence/host-python.txt"

      - name: Test routing contracts and capture blocked translation dry run
        shell: bash
        run: |
          set -Eeuo pipefail
          export PYTHONPATH="ai/runtime"
          python -m unittest discover -s ai/runtime/tests -v 2>&1 | tee "$RUNNER_TEMP/gordus-ai-evidence/wiring-contract-tests.txt"
          set +e
          printf '%s\n' '{"request_id":"ci-preflight","task":"translate","text":"probe","parameters":{"source_language":"es","target_language":"en"}}' | python -m gordus_ai.cli --manifest ai/components.json --wiring ai/wiring.json > "$RUNNER_TEMP/gordus-ai-evidence/wiring-dry-run.json"
          cli_status=$?
          set -e
          test "$cli_status" -eq 3
          python -c 'import json, pathlib, os; p=json.loads(pathlib.Path(os.environ["RUNNER_TEMP"] + "/gordus-ai-evidence/wiring-dry-run.json").read_text()); assert p["status"] == "BLOCKED"; assert p["certification"] == "NOT_GRANTED"; assert p["model_weights_downloaded"] is False; print("Fail-closed wiring CLI: PASS")'

      - name: Build and check isolated Debian 13 AI runtime image
        run: docker build --pull --build-arg GORDUS_AI_SOURCE_SHA="$GITHUB_SHA" --file ai/runtime/Dockerfile --tag gordus-ai-debian13:ci .

      - name: Run preflight in Debian 13 image
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm gordus-ai-debian13:ci bash -lc '
            set -Eeuo pipefail
            . /etc/os-release
            test "$ID" = "debian"
            test "$VERSION_ID" = "13"
            test "$VERSION_CODENAME" = "trixie"
            test -d /var/lib/gordus-ai
            ! test -e /var/cache/huggingface
            bash scripts/ai/preflight.sh /opt/gordus-ai
          ' | tee "$RUNNER_TEMP/gordus-ai-evidence/debian13-preflight.json"

      - name: Upload contract/preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned v4 tag
        with:
          name: ai-three-library-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gordus-ai-evidence/
          if-no-files-found: warn
          retention-days: 14

  package-smoke-tests:
    name: Install each library in a disposable cache-free environment
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4 tag
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5 tag
        with:
          python-version: "3.13"

      - name: Prepare evidence directories
        run: mkdir -p "$RUNNER_TEMP/gordus-ai-evidence"

      - name: Install and smoke-test Argos Translate library only
        shell: bash
        run: |
          set -Eeuo pipefail
          venv="$RUNNER_TEMP/venv-argos"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --no-input -r ai/requirements/argos-translate.txt
          "$venv/bin/python" -c 'import argostranslate, argostranslate.package, argostranslate.translate; from importlib.metadata import version; print("argostranslate=" + version("argostranslate"))'
          "$venv/bin/python" -m pip check
          "$venv/bin/python" -m pip freeze > "$RUNNER_TEMP/gordus-ai-evidence/argos-pip-freeze.txt"
          printf '%s\n' 'ARGOS_LANGUAGE_PACKS_DOWNLOADED=false' > "$RUNNER_TEMP/gordus-ai-evidence/argos-boundary.txt"

      - name: Install and smoke-test CLTK and Stanza backend dependencies only
        shell: bash
        run: |
          set -Eeuo pipefail
          venv="$RUNNER_TEMP/venv-cltk"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --no-input -r ai/requirements/cltk.txt
          "$venv/bin/python" -c 'from cltk import NLP; import stanza; from importlib.metadata import version; print("cltk=" + version("cltk")); print("stanza=" + version("stanza")); assert callable(NLP)'
          "$venv/bin/python" -m pip check
          "$venv/bin/python" -m pip freeze > "$RUNNER_TEMP/gordus-ai-evidence/cltk-pip-freeze.txt"
          printf '%s\n' 'CLTK_RESOURCES_DOWNLOADED=false' > "$RUNNER_TEMP/gordus-ai-evidence/cltk-boundary.txt"

      - name: Install and smoke-test Inspect AI package only
        shell: bash
        run: |
          set -Eeuo pipefail
          venv="$RUNNER_TEMP/venv-inspect-ai"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --no-input -r ai/requirements/inspect-ai.txt
          "$venv/bin/python" -c 'import inspect_ai; from importlib.metadata import version; print("inspect-ai=" + version("inspect-ai"))'
          "$venv/bin/inspect" --version
          "$venv/bin/python" -m pip check
          "$venv/bin/python" -m pip freeze > "$RUNNER_TEMP/gordus-ai-evidence/inspect-ai-pip-freeze.txt"
          printf '%s\n' 'INSPECT_AI_SUITES_EXECUTED=false' > "$RUNNER_TEMP/gordus-ai-evidence/inspect-ai-boundary.txt"

      - name: Record installation boundary
        if: always()
        shell: bash
        run: |
          printf '%s\n' 'PIP_CACHE_RESTORE_SAVE=DISABLED' 'PERSISTENT_INSTALLATION=false' 'ARGOS_LANGUAGE_PACKS_DOWNLOADED=false' 'CLTK_RESOURCES_DOWNLOADED=false' 'INSPECT_AI_SUITES_EXECUTED=false' 'MODEL_WEIGHTS_DOWNLOADED=false' 'CERTIFICATION=NOT_GRANTED' 'TRANSITIVE_HASH_LOCKS=COMBINED_CANDIDATE_REVIEW_REQUIRED' > "$RUNNER_TEMP/gordus-ai-evidence/execution-boundary.txt"

      - name: Upload package/preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned v4 tag
        with:
          name: ai-three-library-package-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gordus-ai-evidence/
          if-no-files-found: warn
          retention-days: 14

  combined-runtime-lock-audit:
    name: Resolve and test the combined hash-locked runtime
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository without persisting Git credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4 tag
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5 tag
        with:
          python-version: "3.13"

      - name: Prepare runtime evidence directory
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/gordus-ai-runtime-evidence"

      - name: Use reviewed lock when present or produce a non-authoritative candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          evidence="$RUNNER_TEMP/gordus-ai-runtime-evidence"
          committed_lock="ai/requirements/locks/runtime-py313-linux-x86_64.txt"
          lock="$RUNNER_TEMP/runtime-py313-linux-x86_64.txt"

          if [[ -f "$committed_lock" ]]; then
            cp "$committed_lock" "$lock"
            printf '%s\n' 'LOCK_SOURCE=COMMITTED_REPOSITORY_FILE' 'LOCK_REVIEW_STATUS=REQUIRES_EXPLICIT_MANIFEST_APPROVAL' > "$evidence/lock-boundary.txt"
          else
            resolver="$RUNNER_TEMP/venv-lock-generator"
            python -m venv "$resolver"
            "$resolver/bin/python" -m pip install --no-input --no-cache-dir 'pip-tools==7.6.2'
            "$resolver/bin/pip-compile" --generate-hashes --resolver=backtracking --strip-extras \
              --output-file "$lock" ai/requirements/runtime.in
            printf '%s\n' 'LOCK_SOURCE=GENERATED_CI_CANDIDATE_NOT_COMMITTED' 'LOCK_REVIEW_STATUS=NOT_APPROVED_FOR_PERSISTENT_INSTALLATION' > "$evidence/lock-boundary.txt"
          fi

          test -s "$lock"
          grep -Eq -- '--hash=sha256:[0-9a-fA-F]{64}' "$lock"
          cp "$lock" "$evidence/runtime-py313-linux-x86_64.txt"
          sha256sum "$lock" ai/requirements/runtime.in ai/components.json ai/wiring.json ai/acquisition.json > "$evidence/source-sha256.txt"
          printf '%s\n' "$GITHUB_SHA" > "$evidence/git-sha.txt"

      - name: Install the combined runtime using hashes only
        shell: bash
        run: |
          set -Eeuo pipefail
          evidence="$RUNNER_TEMP/gordus-ai-runtime-evidence"
          venv="$RUNNER_TEMP/venv-gordus-runtime"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --no-input --no-cache-dir \
            --require-hashes -r "$evidence/runtime-py313-linux-x86_64.txt" \
            --report "$evidence/pip-install-report.json"
          "$venv/bin/python" -m pip check
          "$venv/bin/python" - <<'PY'
          from importlib.metadata import version
          from argostranslate import package, translate
          from cltk import NLP
          import stanza
          import inspect_ai
          expected = {
              "argostranslate": "1.11.0",
              "cltk": "2.5.1",
              "inspect-ai": "0.3.280",
              "PyYAML": "6.0.2",
          }
          for distribution, wanted in expected.items():
              found = version(distribution)
              assert found == wanted, f"{distribution}: expected {wanted}, found {found}"
          assert callable(NLP)
          assert callable(translate.get_installed_languages)
          print("Combined imports and exact direct pins: PASS")
          PY
          "$venv/bin/inspect" --version
          PYTHONPATH="ai/runtime" "$venv/bin/python" -m unittest discover -s ai/runtime/tests -v
          "$venv/bin/python" -m pip freeze > "$evidence/pip-freeze.txt"
          "$venv/bin/python" -m pip inspect --local > "$evidence/pip-inspect.json"
          printf '%s\n' 'PERSISTENT_INSTALLATION=false' 'LANGUAGE_DATA_DOWNLOADS=false' 'MODEL_DOWNLOADS=false' 'TASK_CERTIFICATION=NOT_GRANTED' > "$evidence/execution-boundary.txt"

      - name: Upload lock and combined-runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned v4 tag
        with:
          name: ai-three-library-runtime-lock-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gordus-ai-runtime-evidence/
          if-no-files-found: warn
          retention-days: 14
