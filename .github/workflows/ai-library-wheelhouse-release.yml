name: Materialize reusable Python library wheelhouse

on:
  push:
    branches:
      - refactor/three-library-wiring-2026-10-15
    paths:
      - .github/workflows/ai-library-wheelhouse-release.yml
      - ai/requirements/locks/runtime-py313-linux-x86_64.txt

permissions:
  contents: write

concurrency:
  group: ai-library-wheelhouse-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up CPython 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Validate lock and define versioned bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          LOCK="ai/requirements/locks/runtime-py313-linux-x86_64.txt"
          test -s "$LOCK"
          grep -Eq -- '--hash=sha256:[0-9a-fA-F]{64}' "$LOCK"
          if grep -Eiq '(^|[[:space:]])(nvidia-[^=[:space:]]*|cuda-[^=[:space:]]*|triton)(==|[<=>]|[[:space:]])' "$LOCK"; then
            echo "Unexpected NVIDIA/CUDA/Triton package in CPU-only lock" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/gordus-ai-dist" "$RUNNER_TEMP/gordus-ai-wheelhouse"
          {
            echo "GORDUS_AI_RELEASE_TAG=gordus-ai-python313-linux-x86_64-${GITHUB_SHA:0:12}"
            echo "GORDUS_AI_LOCK_SHA256=$(sha256sum "$LOCK" | awk '{print $1}')"
            echo "GORDUS_AI_WHEELHOUSE=$RUNNER_TEMP/gordus-ai-wheelhouse"
            echo "GORDUS_AI_DIST=$RUNNER_TEMP/gordus-ai-dist"
          } >> "$GITHUB_ENV"

      - name: Download every locked binary wheel
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip --version
          python -m pip download \
            --disable-pip-version-check \
            --no-cache-dir \
            --require-hashes \
            --only-binary=:all: \
            --dest "$GORDUS_AI_WHEELHOUSE" \
            -r ai/requirements/locks/runtime-py313-linux-x86_64.txt
          test "$(find "$GORDUS_AI_WHEELHOUSE" -maxdepth 1 -type f -name '*.whl' | wc -l)" -gt 0
          if find "$GORDUS_AI_WHEELHOUSE" -maxdepth 1 -type f ! -name '*.whl' | grep -q .; then
            echo "Wheelhouse contains an unexpected non-wheel file" >&2
            exit 1
          fi

      - name: Verify offline installation, versions, imports, and contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          VENV="$RUNNER_TEMP/gordus-ai-offline-verify"
          python -m venv "$VENV"
          "$VENV/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            --no-index \
            --find-links "$GORDUS_AI_WHEELHOUSE" \
            --require-hashes \
            -r ai/requirements/locks/runtime-py313-linux-x86_64.txt
          "$VENV/bin/python" -m pip check
          "$VENV/bin/python" - <<'PY'
          from importlib.metadata import distributions, version
          from argostranslate import translate
          from cltk import NLP
          import inspect_ai
          import torch
          expected = {
              "argostranslate": "1.11.0",
              "cltk": "2.5.1",
              "inspect-ai": "0.3.280",
              "PyYAML": "6.0.2",
              "torch": "2.14.1+cpu",
          }
          for name, wanted in expected.items():
              found = version(name)
              assert found == wanted, f"{name}: expected {wanted}, found {found}"
          assert callable(translate.get_installed_languages)
          assert callable(NLP)
          assert torch.version.cuda is None, f"Expected CPU-only PyTorch, got {torch.version.cuda}"
          names = {d.metadata["Name"].lower().replace("_", "-") for d in distributions() if d.metadata.get("Name")}
          unexpected = sorted(n for n in names if n.startswith(("nvidia-", "cuda-")) or n == "triton")
          assert not unexpected, f"Unexpected GPU runtime packages: {unexpected}"
          print("Exact library versions/imports and CPU-only runtime: PASS")
          PY
          "$VENV/bin/inspect" --version
          PYTHONPATH="ai/runtime" "$VENV/bin/python" -m unittest discover -s ai/runtime/tests -v
          "$VENV/bin/python" -m pip freeze | sort > "$GORDUS_AI_DIST/pip-freeze.txt"

      - name: Build inventory, license notices, SHA-256 manifest, and SBOM
        shell: bash
        run: |
          set -Eeuo pipefail
          BUNDLE="$GORDUS_AI_DIST/gordus-ai-library-bundle"
          mkdir -p "$BUNDLE/wheelhouse" "$BUNDLE/licenses"
          cp "$GORDUS_AI_WHEELHOUSE"/*.whl "$BUNDLE/wheelhouse/"
          cp ai/requirements/locks/runtime-py313-linux-x86_64.txt "$BUNDLE/runtime-py313-linux-x86_64.txt"
          cp "$GORDUS_AI_DIST/pip-freeze.txt" "$BUNDLE/pip-freeze.txt"
          export BUNDLE GORDUS_AI_RELEASE_TAG GORDUS_AI_LOCK_SHA256 GITHUB_SHA
          python - <<'PY'
          import hashlib, json, os, re, zipfile, uuid
          from email.parser import Parser
          from pathlib import Path, PurePosixPath
          from datetime import datetime, timezone

          root = Path(os.environ["BUNDLE"])
          wheels = sorted((root / "wheelhouse").glob("*.whl"))
          if not wheels:
              raise SystemExit("No wheels available for manifest")
          components, wheel_records, notices = [], [], []
          license_root = root / "licenses"
          for wheel in wheels:
              blob = wheel.read_bytes()
              digest = hashlib.sha256(blob).hexdigest()
              with zipfile.ZipFile(wheel) as zf:
                  metadata_candidates = [n for n in zf.namelist() if n.endswith(".dist-info/METADATA")]
                  if len(metadata_candidates) != 1:
                      raise SystemExit(f"Expected exactly one METADATA file in {wheel.name}")
                  meta = Parser().parsestr(zf.read(metadata_candidates[0]).decode("utf-8", "replace"))
                  name, version = meta.get("Name"), meta.get("Version")
                  if not name or not version:
                      raise SystemExit(f"Missing package name/version in {wheel.name}")
                  license_value = meta.get("License-Expression") or meta.get("License") or "NOT_DECLARED_IN_METADATA"
                  classifiers = meta.get_all("Classifier", [])
                  classifiers = [x for x in classifiers if x.startswith("License :: ")]
                  component = {
                      "type": "library",
                      "name": name,
                      "version": version,
                      "purl": "pkg:pypi/" + re.sub(r"[-_.]+", "-", name).lower() + "@" + version,
                      "licenses": [{"expression": license_value}] if license_value != "NOT_DECLARED_IN_METADATA" else [],
                      "properties": [{"name": "gordus:license-metadata", "value": license_value}],
                      "hashes": [{"alg": "SHA-256", "content": digest}],
                  }
                  components.append(component)
                  wheel_records.append({
                      "filename": wheel.name, "name": name, "version": version,
                      "size_bytes": len(blob), "sha256": digest, "license": license_value,
                      "license_classifiers": classifiers,
                  })
                  extracted = []
                  for member in zf.namelist():
                      base = PurePosixPath(member).name
                      if not re.match(r"^(LICENSE|LICENCE|COPYING|NOTICE)([._-].*)?$", base, re.I):
                          continue
                      if member.endswith("/") or zf.getinfo(member).file_size > 2_000_000:
                          continue
                      content = zf.read(member)
                      if b"\x00" in content[:4096]:
                          continue
                      dest_name = re.sub(r"[^A-Za-z0-9._-]+", "_", base)
                      package_dir = re.sub(r"[^A-Za-z0-9._-]+", "_", f"{name}-{version}")
                      dest = license_root / package_dir / dest_name
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      if dest.exists():
                          suffix = hashlib.sha256(member.encode()).hexdigest()[:8]
                          dest = dest.with_name(dest.stem + "-" + suffix + dest.suffix)
                      dest.write_bytes(content)
                      extracted.append(str(dest.relative_to(root)))
                  notices.append(f"{name} {version}\n  License metadata: {license_value}\n  Wheel SHA-256: {digest}\n  License/notice files bundled: {', '.join(extracted) if extracted else 'No matching license text found in wheel'}")

          library_versions = {x["name"].lower().replace("_", "-"): x["version"] for x in wheel_records}
          required = {"argostranslate": "1.11.0", "cltk": "2.5.1", "inspect-ai": "0.3.280"}
          for name, wanted in required.items():
              if library_versions.get(name) != wanted:
                  raise SystemExit(f"Direct library pin mismatch for {name}: {library_versions.get(name)} != {wanted}")
          manifest = {
              "schema_version": 1,
              "artifact_kind": "reusable-python-binary-wheelhouse",
              "release_tag": os.environ["GORDUS_AI_RELEASE_TAG"],
              "source_commit": os.environ["GITHUB_SHA"],
              "python": "3.13",
              "platform": "linux-x86_64",
              "lock_file": "runtime-py313-linux-x86_64.txt",
              "lock_sha256": os.environ["GORDUS_AI_LOCK_SHA256"],
              "network_free_install_verified": True,
              "pip_check": "PASS",
              "task_quality_certification": "NOT_GRANTED",
              "language_data_or_model_assets_downloaded": False,
              "direct_libraries": required,
              "wheel_count": len(wheel_records),
              "total_wheel_bytes": sum(x["size_bytes"] for x in wheel_records),
              "wheels": wheel_records,
          }
          (root / "manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          (root / "THIRD_PARTY_NOTICES.txt").write_text(
              "Third-party package inventory for the hash-locked wheelhouse.\n"
              "License metadata is reproduced as reported by each wheel's METADATA; included license/notice files are under licenses/.\n"
              "Review the license terms for your use and redistribution.\n\n" + "\n\n".join(notices) + "\n",
              encoding="utf-8",
          )
          sbom = {
              "bomFormat": "CycloneDX", "specVersion": "1.5", "version": 1,
              "serialNumber": "urn:uuid:" + str(uuid.uuid5(uuid.NAMESPACE_URL, os.environ["GITHUB_SHA"] + ":gordus-ai-wheelhouse")),
              "metadata": {
                  "timestamp": datetime.now(timezone.utc).isoformat(),
                  "component": {
                      "type": "application", "name": "Gordus-Hub three-library Python wheelhouse",
                      "version": os.environ["GORDUS_AI_RELEASE_TAG"],
                      "purl": "pkg:generic/gordus-ai-library-wheelhouse@" + os.environ["GITHUB_SHA"][:12],
                      "hashes": [{"alg": "SHA-256", "content": os.environ["GORDUS_AI_LOCK_SHA256"]}],
                  },
              },
              "components": components,
          }
          (root / "sbom.cdx.json").write_text(json.dumps(sbom, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          (root / "INSTALL.md").write_text("""# Offline package installation

This wheelhouse is for CPython 3.13 on Linux x86_64 only. Verify the external SHA256SUMS file before extracting this archive. Create a new virtual environment; do not overwrite an existing one.

Run from this directory:
    python3.13 -m venv .venv-gordus-ai
    . .venv-gordus-ai/bin/activate
    python -m pip install --no-index --find-links wheelhouse --require-hashes -r runtime-py313-linux-x86_64.txt
    python -m pip check

The installation command uses only the wheelhouse and the committed hash lock. This installs Python distributions only; it does not fetch Argos language packs, CLTK corpora/resources, Inspect AI suites, or model weights. Functional quality certification remains separate.
""", encoding="utf-8")
          PY
          cp "$BUNDLE/manifest.json" "$GORDUS_AI_DIST/ai-libraries-py313-linux-x86_64.manifest.json"
          cp "$BUNDLE/sbom.cdx.json" "$GORDUS_AI_DIST/ai-libraries-py313-linux-x86_64.sbom.cdx.json"
          cp "$BUNDLE/THIRD_PARTY_NOTICES.txt" "$GORDUS_AI_DIST/ai-libraries-py313-linux-x86_64.THIRD_PARTY_NOTICES.txt"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -cf - -C "$GORDUS_AI_DIST" gordus-ai-library-bundle | gzip -n > "$GORDUS_AI_DIST/ai-libraries-py313-linux-x86_64.tar.gz"
          (
            cd "$GORDUS_AI_DIST"
            sha256sum ai-libraries-py313-linux-x86_64.tar.gz ai-libraries-py313-linux-x86_64.manifest.json ai-libraries-py313-linux-x86_64.sbom.cdx.json ai-libraries-py313-linux-x86_64.THIRD_PARTY_NOTICES.txt > ai-libraries-py313-linux-x86_64.SHA256SUMS
          )
          SIZE="$(stat -c '%s' "$GORDUS_AI_DIST/ai-libraries-py313-linux-x86_64.tar.gz")"
          if (( SIZE >= 1800000000 )); then
            echo "Wheelhouse archive is >=1.8GB; refusing to publish near the 2GB asset limit." >&2
            exit 1
          fi
          {
            echo "WHEEL_COUNT=$(find "$GORDUS_AI_WHEELHOUSE" -maxdepth 1 -type f -name '*.whl' | wc -l)"
            echo "ARCHIVE_SIZE_BYTES=$SIZE"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GORDUS_AI_DIST/ai-libraries-py313-linux-x86_64.manifest.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish immutable GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          TAG="$GORDUS_AI_RELEASE_TAG"
          if gh release view "$TAG" --repo Gordus-Hub/Gordus-Hub >/dev/null 2>&1; then
            echo "Release tag already exists; refusing to overwrite immutable package assets: $TAG" >&2
            exit 1
          fi
          gh release create "$TAG" \
            "$GORDUS_AI_DIST/ai-libraries-py313-linux-x86_64.tar.gz" \
            "$GORDUS_AI_DIST/ai-libraries-py313-linux-x86_64.SHA256SUMS" \
            "$GORDUS_AI_DIST/ai-libraries-py313-linux-x86_64.manifest.json" \
            "$GORDUS_AI_DIST/ai-libraries-py313-linux-x86_64.sbom.cdx.json" \
            "$GORDUS_AI_DIST/ai-libraries-py313-linux-x86_64.THIRD_PARTY_NOTICES.txt" \
            --repo Gordus-Hub/Gordus-Hub \
            --target "$GITHUB_SHA" \
            --title "Reusable Python libraries — CPython 3.13 Linux x86_64 — ${GITHUB_SHA:0:12}" \
            --notes "Reusable, SHA-256-locked binary wheelhouse for Argos Translate 1.11.0, CLTK 2.5.1, and Inspect AI 0.3.280 plus the complete locked dependency set. Includes offline-install verification, checksums, package inventory, CycloneDX SBOM, and third-party notices. This is a prerelease package artifact tied to source commit $GITHUB_SHA; it is not a server installation and grants no task-quality certification." \
            --prerelease
