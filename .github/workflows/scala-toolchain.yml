name: Scala toolchain validation

on:
  pull_request:
    paths:
      - "toolchains/scala/**"
      - ".github/workflows/scala-toolchain.yml"
  push:
    branches: ["main"]
    paths:
      - "toolchains/scala/**"
      - ".github/workflows/scala-toolchain.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scala-toolchain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pins-preflight:
    name: Validate Scala + JDK 25 pins, GPG key, environment and isolation (fail-closed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13 (stdlib only, for the validator)
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate components.json against Dockerfile pins
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/scala-evidence"
          python toolchains/scala/scripts/validate_scala_toolchain.py --repo-root . --report "$RUNNER_TEMP/scala-evidence/scala-preflight.json"
          python -c 'import json, os; p=json.load(open(os.environ["RUNNER_TEMP"] + "/scala-evidence/scala-preflight.json")); assert p["result"] == "PASS", p; assert p["certification"] == "NOT_GRANTED"'
          sh -n toolchains/scala/tests/test_scala_toolchain.sh

  image-smoke-and-kestra:
    name: Build Debian 13 Scala image, scalac + scala-cli run/package, gate in Kestra
    needs: pins-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build isolated Scala toolchain image (SHA-256 + GPG verified inside)
        run: docker build --pull --file toolchains/scala/Dockerfile --tag gordus-scala:ci .

      - name: Run the Scala smoke test inside the image (offline)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/scala-evidence"
          docker run --rm --network none gordus-scala:ci sh /opt/gordus-scala/tests/test_scala_toolchain.sh | tee "$RUNNER_TEMP/scala-evidence/smoke.txt"
          docker run --rm gordus-scala:ci sh -c 'test "$(id -un)" = scala && test "$JAVA_HOME" = /opt/scala/jdk-25 && test "$GORDUS_SCALA_OFFLINE" = true && ! command -v python3 && ! command -v curl && ! command -v gpg && ! touch /opt/gordus-scala/probe 2>/dev/null && ! touch /opt/scala/probe 2>/dev/null'
          docker image inspect gordus-scala:ci --format '{{.Size}}' > "$RUNNER_TEMP/scala-evidence/image-size-bytes.txt"
          smoke="$RUNNER_TEMP/scala-evidence/smoke.txt"
          {
            printf 'SCALAC_VERSION_LINE=%s\n' "$(grep -m1 '^Scala compiler version ' "$smoke")"
            printf 'JAVA_VERSION_LINE=%s\n' "$(grep -m1 '^openjdk version ' "$smoke")"
            printf 'HOLA_OUTPUT=%s\n' "$(grep -m1 '^Hola, ' "$smoke")"
            if grep -qx 'Tests: 3 OK, 0 fallos' "$smoke"; then echo 'TEST_RESULT=PASS'; else echo 'TEST_RESULT=FAIL'; fi
            if grep -q '^PASS: toolchain Scala ' "$smoke"; then echo 'SMOKE_RESULT=PASS'; else echo 'SMOKE_RESULT=FAIL'; fi
          } >> "$GITHUB_ENV"

      - name: Generate a one-run Kestra test credential
        shell: bash
        run: |
          set -euo pipefail
          password="KCI$(openssl rand -hex 24)A9!"
          echo "::add-mask::$password"
          printf 'KESTRA_TEST_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"

      - name: Start ephemeral pinned Kestra engine
        shell: bash
        run: |
          set -euo pipefail
          docker pull kestra/kestra:v1.3.40-slim
          configuration="$(printf 'kestra:\n  server:\n    basicAuth:\n      username: "admin@kestra.io"\n      password: "%s"\n' "$KESTRA_TEST_PASSWORD")"
          docker run -d --name kestra-scala-smoke -p 127.0.0.1:8080:8080 \
            -e KESTRA_CONFIGURATION="$configuration" \
            kestra/kestra:v1.3.40-slim server local
          for attempt in $(seq 1 36); do
            if ! docker inspect -f '{{.State.Running}}' kestra-scala-smoke 2>/dev/null | grep -qx true; then
              docker logs kestra-scala-smoke || true; exit 1
            fi
            if curl --location --fail --silent http://127.0.0.1:8080/ >/dev/null; then echo "Kestra API is ready."; exit 0; fi
            sleep 5
          done
          echo "Kestra API did not become ready."; docker logs kestra-scala-smoke || true; exit 1

      - name: Import Scala toolchain flow and require SUCCESS with observed results
        shell: bash
        run: |
          set -euo pipefail
          auth="admin@kestra.io:$KESTRA_TEST_PASSWORD"
          curl --fail --silent --show-error --user "$auth" -X POST -H "Content-Type: application/x-yaml" \
            --data-binary @toolchains/scala/kestra/scala_toolchain_smoke.yaml \
            http://127.0.0.1:8080/api/v1/main/flows -o /tmp/kestra-scala-import.json
          jq -e '.id == "scala_toolchain_smoke" and .namespace == "gordus_hub.toolchains"' /tmp/kestra-scala-import.json
          response="$(curl --fail --silent --show-error --user "$auth" -X POST \
            -F "scalac_version_line=$SCALAC_VERSION_LINE" -F "java_version_line=$JAVA_VERSION_LINE" \
            -F "hola_output=$HOLA_OUTPUT" -F "test_result=$TEST_RESULT" \
            -F "smoke_result=$SMOKE_RESULT" \
            http://127.0.0.1:8080/api/v1/main/executions/gordus_hub.toolchains/scala_toolchain_smoke)"
          execution_id="$(printf '%s' "$response" | jq -r '.id // empty')"
          test -n "$execution_id"
          for attempt in $(seq 1 60); do
            status_json="$(curl --fail --silent --show-error --user "$auth" "http://127.0.0.1:8080/api/v1/main/executions/$execution_id")"
            state="$(printf '%s' "$status_json" | jq -r '.state.current // empty')"
            echo "Scala toolchain execution $execution_id state: $state"
            case "$state" in
              SUCCESS) exit 0 ;;
              FAILED|WARNING|KILLING|KILLED|CANCELLED) echo "$status_json"; exit 1 ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for Scala toolchain flow execution $execution_id."; exit 1

      - name: Upload Scala toolchain evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scala-toolchain-evidence
          path: ${{ runner.temp }}/scala-evidence
          if-no-files-found: warn

      - name: Print Kestra logs on failure
        if: failure()
        run: docker logs kestra-scala-smoke || true

      - name: Stop ephemeral Kestra engine
        if: always()
        run: docker rm -f kestra-scala-smoke || true
