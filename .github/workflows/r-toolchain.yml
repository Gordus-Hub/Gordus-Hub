name: R toolchain validation

on:
  pull_request:
    paths:
      - "toolchains/r/**"
      - ".github/workflows/r-toolchain.yml"
  push:
    branches: ["main"]
    paths:
      - "toolchains/r/**"
      - ".github/workflows/r-toolchain.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r-toolchain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pins-preflight:
    name: Validate R pins, checksums, CRAN lock, security floor and isolation (fail-closed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13 (stdlib only, for the validator)
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate components.json against Dockerfile pins
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/r-evidence"
          python toolchains/r/scripts/validate_r_toolchain.py --repo-root . --report "$RUNNER_TEMP/r-evidence/r-preflight.json"
          python -c 'import json, os; p=json.load(open(os.environ["RUNNER_TEMP"] + "/r-evidence/r-preflight.json")); assert p["result"] == "PASS", p; assert p["certification"] == "NOT_GRANTED"'
          sh -n toolchains/r/tests/test_r_toolchain.sh

  image-smoke-and-kestra:
    name: Build Debian 13 R image, Rscript/install.packages/renv/testthat, gate in Kestra
    needs: pins-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build isolated R toolchain image (checksums verified inside)
        run: docker build --pull --file toolchains/r/Dockerfile --tag gordus-r:ci .

      - name: Run Rscript, parse, offline install.packages, renv and testthat inside the image (offline)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/r-evidence"
          docker run --rm --network none gordus-r:ci sh /opt/gordus-r/tests/test_r_toolchain.sh | tee "$RUNNER_TEMP/r-evidence/smoke.txt"
          docker run --rm gordus-r:ci sh -c 'test "$(id -un)" = ruser && test "$R_LIBS_SITE" = /opt/r-site-library && ! command -v python3 && ! command -v curl && ! touch /opt/gordus-r/probe 2>/dev/null && ! touch /opt/r/probe 2>/dev/null && ! touch /opt/r-site-library/probe 2>/dev/null'
          docker image inspect gordus-r:ci --format '{{.Size}}' > "$RUNNER_TEMP/r-evidence/image-size-bytes.txt"
          smoke="$RUNNER_TEMP/r-evidence/smoke.txt"
          {
            printf 'R_VERSION_LINE=%s\n' "$(grep -m1 '^R [0-9]' "$smoke")"
            printf 'TESTTHAT_VERSION_LINE=%s\n' "$(grep -m1 '^testthat [0-9]' "$smoke")"
            printf 'RENV_VERSION_LINE=%s\n' "$(grep -m1 '^renv [0-9]' "$smoke")"
            printf 'HOLA_OUTPUT=%s\n' "$(grep -m1 '^Hola, ' "$smoke")"
            if grep -q '^install.packages offline OK' "$smoke" && grep -q '^renv restore offline OK' "$smoke"; then echo 'OFFLINE_INSTALL=PASS'; else echo 'OFFLINE_INSTALL=FAIL'; fi
            if grep -q '^testthat OK' "$smoke"; then echo 'TEST_RESULT=PASS'; else echo 'TEST_RESULT=FAIL'; fi
            if grep -q '^PASS: toolchain R ' "$smoke"; then echo 'SMOKE_RESULT=PASS'; else echo 'SMOKE_RESULT=FAIL'; fi
          } >> "$GITHUB_ENV"

      - name: Generate a one-run Kestra test credential
        shell: bash
        run: |
          set -euo pipefail
          password="KCI$(openssl rand -hex 24)A9!"
          echo "::add-mask::$password"
          printf 'KESTRA_TEST_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"

      - name: Start ephemeral pinned Kestra engine
        shell: bash
        run: |
          set -euo pipefail
          docker pull kestra/kestra:v1.3.40-slim
          configuration="$(printf 'kestra:\n  server:\n    basicAuth:\n      username: "admin@kestra.io"\n      password: "%s"\n' "$KESTRA_TEST_PASSWORD")"
          docker run -d --name kestra-r-smoke -p 127.0.0.1:8080:8080 \
            -e KESTRA_CONFIGURATION="$configuration" \
            kestra/kestra:v1.3.40-slim server local
          for attempt in $(seq 1 36); do
            if ! docker inspect -f '{{.State.Running}}' kestra-r-smoke 2>/dev/null | grep -qx true; then
              docker logs kestra-r-smoke || true; exit 1
            fi
            if curl --location --fail --silent http://127.0.0.1:8080/ >/dev/null; then echo "Kestra API is ready."; exit 0; fi
            sleep 5
          done
          echo "Kestra API did not become ready."; docker logs kestra-r-smoke || true; exit 1

      - name: Import R toolchain flow and require SUCCESS with observed results
        shell: bash
        run: |
          set -euo pipefail
          auth="admin@kestra.io:$KESTRA_TEST_PASSWORD"
          curl --fail --silent --show-error --user "$auth" -X POST -H "Content-Type: application/x-yaml" \
            --data-binary @toolchains/r/kestra/r_toolchain_smoke.yaml \
            http://127.0.0.1:8080/api/v1/main/flows -o /tmp/kestra-r-import.json
          jq -e '.id == "r_toolchain_smoke" and .namespace == "gordus_hub.toolchains"' /tmp/kestra-r-import.json
          response="$(curl --fail --silent --show-error --user "$auth" -X POST \
            -F "r_version=$R_VERSION_LINE" -F "testthat_version=$TESTTHAT_VERSION_LINE" \
            -F "renv_version=$RENV_VERSION_LINE" -F "hola_output=$HOLA_OUTPUT" \
            -F "offline_install=$OFFLINE_INSTALL" -F "test_result=$TEST_RESULT" -F "smoke_result=$SMOKE_RESULT" \
            http://127.0.0.1:8080/api/v1/main/executions/gordus_hub.toolchains/r_toolchain_smoke)"
          execution_id="$(printf '%s' "$response" | jq -r '.id // empty')"
          test -n "$execution_id"
          for attempt in $(seq 1 60); do
            status_json="$(curl --fail --silent --show-error --user "$auth" "http://127.0.0.1:8080/api/v1/main/executions/$execution_id")"
            state="$(printf '%s' "$status_json" | jq -r '.state.current // empty')"
            echo "R toolchain execution $execution_id state: $state"
            case "$state" in
              SUCCESS) exit 0 ;;
              FAILED|WARNING|KILLING|KILLED|CANCELLED) echo "$status_json"; exit 1 ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for R toolchain flow execution $execution_id."; exit 1

      - name: Upload R toolchain evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r-toolchain-evidence
          path: ${{ runner.temp }}/r-evidence
          if-no-files-found: warn

      - name: Print Kestra logs on failure
        if: failure()
        run: docker logs kestra-r-smoke || true

      - name: Stop ephemeral Kestra engine
        if: always()
        run: docker rm -f kestra-r-smoke || true
