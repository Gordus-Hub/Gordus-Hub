name: Go toolchain validation

on:
  pull_request:
    paths:
      - "toolchains/go/**"
      - ".github/workflows/go-toolchain.yml"
  push:
    branches: ["main"]
    paths:
      - "toolchains/go/**"
      - ".github/workflows/go-toolchain.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-toolchain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pins-preflight:
    name: Validate Go pins, environment and isolation (fail-closed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13 (stdlib only, for the validator)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate components.json against Dockerfile pins
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/go-evidence"
          python toolchains/go/scripts/validate_go_toolchain.py --repo-root . --report "$RUNNER_TEMP/go-evidence/go-preflight.json"
          python -c 'import json, os; p=json.load(open(os.environ["RUNNER_TEMP"] + "/go-evidence/go-preflight.json")); assert p["result"] == "PASS", p; assert p["certification"] == "NOT_GRANTED"'
          sh -n toolchains/go/tests/test_go_toolchain.sh

  image-smoke-and-kestra:
    name: Build Debian 13 Go image, run/build/test Go, gate in Kestra
    needs: pins-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build isolated Go toolchain image (SHA-256 verified inside)
        run: docker build --pull --file toolchains/go/Dockerfile --tag gordus-go:ci .

      - name: Run go run/build/vet/test/mod verify/cross inside the image (offline)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/go-evidence"
          docker run --rm --network none gordus-go:ci sh /opt/gordus-go/tests/test_go_toolchain.sh | tee "$RUNNER_TEMP/go-evidence/smoke.txt"
          docker run --rm gordus-go:ci sh -c 'test "$(id -un)" = gouser && test "$(go env GOROOT)" = /opt/go && ! command -v python3 && ! command -v curl && ! touch /opt/gordus-go/probe 2>/dev/null && ! touch /opt/go/probe 2>/dev/null'
          smoke="$RUNNER_TEMP/go-evidence/smoke.txt"
          {
            printf 'GO_VERSION_LINE=%s\n' "$(grep -m1 '^go version ' "$smoke")"
            printf 'HOLA_OUTPUT=%s\n' "$(grep -m1 '^Hola, ' "$smoke")"
            printf 'GO_ENV_LINE=%s\n' "$(grep -m1 '^GOROOT=' "$smoke")"
            if grep -q '^ok ' "$smoke"; then echo 'TEST_RESULT=PASS'; else echo 'TEST_RESULT=FAIL'; fi
            if grep -q '^PASS: toolchain Go ' "$smoke"; then echo 'SMOKE_RESULT=PASS'; else echo 'SMOKE_RESULT=FAIL'; fi
          } >> "$GITHUB_ENV"

      - name: Generate a one-run Kestra test credential
        shell: bash
        run: |
          set -euo pipefail
          password="KCI$(openssl rand -hex 24)A9!"
          echo "::add-mask::$password"
          printf 'KESTRA_TEST_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"

      - name: Start ephemeral pinned Kestra engine
        shell: bash
        run: |
          set -euo pipefail
          docker pull kestra/kestra:v1.3.40-slim
          configuration="$(printf 'kestra:\n  server:\n    basicAuth:\n      username: "admin@kestra.io"\n      password: "%s"\n' "$KESTRA_TEST_PASSWORD")"
          docker run -d --name kestra-go-smoke -p 127.0.0.1:8080:8080 \
            -e KESTRA_CONFIGURATION="$configuration" \
            kestra/kestra:v1.3.40-slim server local
          for attempt in $(seq 1 36); do
            if ! docker inspect -f '{{.State.Running}}' kestra-go-smoke 2>/dev/null | grep -qx true; then
              docker logs kestra-go-smoke || true; exit 1
            fi
            if curl --location --fail --silent http://127.0.0.1:8080/ >/dev/null; then echo "Kestra API is ready."; exit 0; fi
            sleep 5
          done
          echo "Kestra API did not become ready."; docker logs kestra-go-smoke || true; exit 1

      - name: Import Go toolchain flow and require SUCCESS with observed results
        shell: bash
        run: |
          set -euo pipefail
          auth="admin@kestra.io:$KESTRA_TEST_PASSWORD"
          curl --fail --silent --show-error --user "$auth" -X POST -H "Content-Type: application/x-yaml" \
            --data-binary @toolchains/go/kestra/go_toolchain_smoke.yaml \
            http://127.0.0.1:8080/api/v1/main/flows -o /tmp/kestra-go-import.json
          jq -e '.id == "go_toolchain_smoke" and .namespace == "gordus_hub.toolchains"' /tmp/kestra-go-import.json
          response="$(curl --fail --silent --show-error --user "$auth" -X POST \
            -F "go_version_line=$GO_VERSION_LINE" -F "hola_output=$HOLA_OUTPUT" \
            -F "go_env_line=$GO_ENV_LINE" -F "test_result=$TEST_RESULT" \
            -F "smoke_result=$SMOKE_RESULT" \
            http://127.0.0.1:8080/api/v1/main/executions/gordus_hub.toolchains/go_toolchain_smoke)"
          execution_id="$(printf '%s' "$response" | jq -r '.id // empty')"
          test -n "$execution_id"
          for attempt in $(seq 1 60); do
            status_json="$(curl --fail --silent --show-error --user "$auth" "http://127.0.0.1:8080/api/v1/main/executions/$execution_id")"
            state="$(printf '%s' "$status_json" | jq -r '.state.current // empty')"
            echo "Go toolchain execution $execution_id state: $state"
            case "$state" in
              SUCCESS) exit 0 ;;
              FAILED|WARNING|KILLING|KILLED|CANCELLED) echo "$status_json"; exit 1 ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for Go toolchain flow execution $execution_id."; exit 1

      - name: Upload Go toolchain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-toolchain-evidence
          path: ${{ runner.temp }}/go-evidence
          if-no-files-found: warn

      - name: Print Kestra logs on failure
        if: failure()
        run: docker logs kestra-go-smoke || true

      - name: Stop ephemeral Kestra engine
        if: always()
        run: docker rm -f kestra-go-smoke || true
