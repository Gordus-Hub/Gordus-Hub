name: C++23 toolchain validation

on:
  pull_request:
    paths:
      - "toolchains/cpp/**"
      - ".github/workflows/cpp-toolchain.yml"
  push:
    branches: ["main"]
    paths:
      - "toolchains/cpp/**"
      - ".github/workflows/cpp-toolchain.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpp-toolchain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pins-preflight:
    name: Validate C++ package pins, image policy and isolation (fail-closed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13 (stdlib only, for the validator)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate components.json against Dockerfile pins
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/cpp-evidence"
          python toolchains/cpp/scripts/validate_cpp_toolchain.py --repo-root . --report "$RUNNER_TEMP/cpp-evidence/cpp-preflight.json"
          python -c 'import json, os; p=json.load(open(os.environ["RUNNER_TEMP"] + "/cpp-evidence/cpp-preflight.json")); assert p["result"] == "PASS", p; assert p["certification"] == "NOT_GRANTED"'
          sh -n toolchains/cpp/tests/test_cpp_toolchain.sh

  image-smoke-and-kestra:
    name: Build Debian 13 C++23 image, compile/link/build, gate in Kestra
    needs: pins-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build isolated C++23 toolchain image (Debian packages pinned pkg=version)
        run: docker build --pull --file toolchains/cpp/Dockerfile --tag gordus-cpp:ci .

      - name: Compile and run C++23 with g++/clang++, CMake + Ninja/make, LLD, import std (offline)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/cpp-evidence"
          docker run --rm --network none gordus-cpp:ci sh /opt/gordus-cpp/tests/test_cpp_toolchain.sh | tee "$RUNNER_TEMP/cpp-evidence/smoke.txt"
          docker run --rm gordus-cpp:ci sh -c 'test "$(id -un)" = cppuser && ! command -v python3 && ! command -v curl && ! touch /opt/gordus-cpp/probe 2>/dev/null && ! touch /usr/bin/probe 2>/dev/null'
          docker image inspect gordus-cpp:ci --format '{{.Size}}' > "$RUNNER_TEMP/cpp-evidence/image-size-bytes.txt"
          smoke="$RUNNER_TEMP/cpp-evidence/smoke.txt"
          {
            printf 'GCC_VERSION=%s\n' "$(grep -m1 '^g++ ' "$smoke")"
            printf 'CLANG_VERSION=%s\n' "$(grep -m1 '^clang++ ' "$smoke")"
            printf 'HOLA_OUTPUT=%s\n' "$(docker run --rm --network none gordus-cpp:ci sh -c 'cd /tmp && g++ -std=c++23 /opt/gordus-cpp/examples/hola/main.cpp -o h && ./h' | sed -n 1p)"
            if grep -q '^import std OK ' "$smoke"; then echo 'IMPORT_STD_RESULT=PASS'; else echo 'IMPORT_STD_RESULT=FAIL'; fi
            if grep -q '^PASS: toolchain C++23 ' "$smoke"; then echo 'SMOKE_RESULT=PASS'; else echo 'SMOKE_RESULT=FAIL'; fi
          } >> "$GITHUB_ENV"

      - name: Generate a one-run Kestra test credential
        shell: bash
        run: |
          set -euo pipefail
          password="KCI$(openssl rand -hex 24)A9!"
          echo "::add-mask::$password"
          printf 'KESTRA_TEST_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"

      - name: Start ephemeral pinned Kestra engine
        shell: bash
        run: |
          set -euo pipefail
          docker pull kestra/kestra:v1.3.40-slim
          configuration="$(printf 'kestra:\n  server:\n    basicAuth:\n      username: "admin@kestra.io"\n      password: "%s"\n' "$KESTRA_TEST_PASSWORD")"
          docker run -d --name kestra-cpp-smoke -p 127.0.0.1:8080:8080 \
            -e KESTRA_CONFIGURATION="$configuration" \
            kestra/kestra:v1.3.40-slim server local
          for attempt in $(seq 1 36); do
            if ! docker inspect -f '{{.State.Running}}' kestra-cpp-smoke 2>/dev/null | grep -qx true; then
              docker logs kestra-cpp-smoke || true; exit 1
            fi
            if curl --location --fail --silent http://127.0.0.1:8080/ >/dev/null; then echo "Kestra API is ready."; exit 0; fi
            sleep 5
          done
          echo "Kestra API did not become ready."; docker logs kestra-cpp-smoke || true; exit 1

      - name: Import C++ toolchain flow and require SUCCESS with observed results
        shell: bash
        run: |
          set -euo pipefail
          auth="admin@kestra.io:$KESTRA_TEST_PASSWORD"
          curl --fail --silent --show-error --user "$auth" -X POST -H "Content-Type: application/x-yaml" \
            --data-binary @toolchains/cpp/kestra/cpp_toolchain_smoke.yaml \
            http://127.0.0.1:8080/api/v1/main/flows -o /tmp/kestra-cpp-import.json
          jq -e '.id == "cpp_toolchain_smoke" and .namespace == "gordus_hub.toolchains"' /tmp/kestra-cpp-import.json
          response="$(curl --fail --silent --show-error --user "$auth" -X POST \
            -F "gcc_version=$GCC_VERSION" -F "clang_version=$CLANG_VERSION" \
            -F "hola_output=$HOLA_OUTPUT" -F "import_std_result=$IMPORT_STD_RESULT" \
            -F "smoke_result=$SMOKE_RESULT" \
            http://127.0.0.1:8080/api/v1/main/executions/gordus_hub.toolchains/cpp_toolchain_smoke)"
          execution_id="$(printf '%s' "$response" | jq -r '.id // empty')"
          test -n "$execution_id"
          for attempt in $(seq 1 60); do
            status_json="$(curl --fail --silent --show-error --user "$auth" "http://127.0.0.1:8080/api/v1/main/executions/$execution_id")"
            state="$(printf '%s' "$status_json" | jq -r '.state.current // empty')"
            echo "C++ toolchain execution $execution_id state: $state"
            case "$state" in
              SUCCESS) exit 0 ;;
              FAILED|WARNING|KILLING|KILLED|CANCELLED) echo "$status_json"; exit 1 ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for C++ toolchain flow execution $execution_id."; exit 1

      - name: Upload C++ toolchain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpp-toolchain-evidence
          path: ${{ runner.temp }}/cpp-evidence
          if-no-files-found: warn

      - name: Print Kestra logs on failure
        if: failure()
        run: docker logs kestra-cpp-smoke || true

      - name: Stop ephemeral Kestra engine
        if: always()
        run: docker rm -f kestra-cpp-smoke || true
