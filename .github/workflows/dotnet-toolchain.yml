name: .NET 10 SDK (C#) toolchain validation

on:
  pull_request:
    paths:
      - "toolchains/dotnet/**"
      - ".github/workflows/dotnet-toolchain.yml"
  push:
    branches: ["main"]
    paths:
      - "toolchains/dotnet/**"
      - ".github/workflows/dotnet-toolchain.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-toolchain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pins-preflight:
    name: Validate .NET SDK pins (SHA-512 vs releases.json), NuGet policy and isolation (fail-closed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13 (stdlib only, for the validator)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate components.json against Dockerfile pins and official releases.json
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/dotnet-evidence"
          python toolchains/dotnet/scripts/validate_dotnet_toolchain.py --repo-root . --report "$RUNNER_TEMP/dotnet-evidence/dotnet-preflight.json"
          python -c 'import json, os; p=json.load(open(os.environ["RUNNER_TEMP"] + "/dotnet-evidence/dotnet-preflight.json")); assert p["result"] == "PASS", p; assert p["certification"] == "NOT_GRANTED"'
          sh -n toolchains/dotnet/tests/test_dotnet_toolchain.sh
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/dotnet-evidence/releases.json" \
            https://builds.dotnet.microsoft.com/dotnet/release-metadata/10.0/releases.json
          python - "$RUNNER_TEMP/dotnet-evidence/releases.json" <<'EOF'
          import json, sys
          rel = json.load(open(sys.argv[1]))
          comp = json.load(open("toolchains/dotnet/components.json"))["components"][0]
          sdks = {}
          for r in rel["releases"]:
              for s in [r.get("sdk") or {}] + list(r.get("sdks") or []):
                  if s.get("version"):
                      sdks[s["version"]] = s
          sdk = sdks.get(comp["version"])
          assert sdk is not None, f"SDK {comp['version']} not in releases.json"
          assert sdk["runtime-version"] == comp["runtime_version"], sdk["runtime-version"]
          files = {f["name"]: f for f in sdk["files"]}
          for art in comp["artifacts"]:
              f = files[f"dotnet-sdk-{art['rid']}.tar.gz"]
              assert f["url"] == art["url"], (f["url"], art["url"])
              assert f["hash"] == art["sha512"], f"sha512 mismatch for {art['rid']}"
              print(f"releases.json OK: {art['file']} sha512 matches")
          EOF

  image-smoke-and-kestra:
    name: Build Debian 13 .NET image, restore/build/run/self-check, gate in Kestra
    needs: pins-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build isolated .NET SDK toolchain image (SHA-512 verified inside)
        run: docker build --pull --file toolchains/dotnet/Dockerfile --tag gordus-dotnet:ci .

      - name: Run dotnet info, restore --locked-mode, build, run, self-check and negatives inside the image (offline)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/dotnet-evidence"
          docker run --rm --network none gordus-dotnet:ci sh /opt/gordus-dotnet/tests/test_dotnet_toolchain.sh | tee "$RUNNER_TEMP/dotnet-evidence/smoke.txt"
          docker run --rm gordus-dotnet:ci sh -c 'test "$(id -un)" = dotnetuser && test "$DOTNET_CLI_TELEMETRY_OPTOUT" = 1 && ! command -v python3 && ! command -v curl && ! touch /opt/gordus-dotnet/probe 2>/dev/null && ! touch /usr/share/dotnet/probe 2>/dev/null && touch /var/lib/gordus-dotnet/nuget/packages/probe'
          docker image inspect gordus-dotnet:ci --format '{{.Size}}' > "$RUNNER_TEMP/dotnet-evidence/image-size-bytes.txt"
          smoke="$RUNNER_TEMP/dotnet-evidence/smoke.txt"
          {
            printf 'SDK_VERSION_LINE=%s\n' "$(grep -m1 '^dotnet sdk ' "$smoke")"
            printf 'RUNTIME_VERSION_LINE=%s\n' "$(grep -m1 '^dotnet runtime ' "$smoke")"
            printf 'HOLA_OUTPUT=%s\n' "$(grep -m1 '^Hola, ' "$smoke")"
            if grep -q '^SELF_CHECK=PASS' "$smoke"; then echo 'TEST_RESULT=PASS'; else echo 'TEST_RESULT=FAIL'; fi
            if grep -q '^PASS: toolchain .NET SDK ' "$smoke"; then echo 'SMOKE_RESULT=PASS'; else echo 'SMOKE_RESULT=FAIL'; fi
          } >> "$GITHUB_ENV"

      - name: Generate a one-run Kestra test credential
        shell: bash
        run: |
          set -euo pipefail
          password="KCI$(openssl rand -hex 24)A9!"
          echo "::add-mask::$password"
          printf 'KESTRA_TEST_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"

      - name: Start ephemeral pinned Kestra engine
        shell: bash
        run: |
          set -euo pipefail
          docker pull kestra/kestra:v1.3.40-slim
          configuration="$(printf 'kestra:\n  server:\n    basicAuth:\n      username: "admin@kestra.io"\n      password: "%s"\n' "$KESTRA_TEST_PASSWORD")"
          docker run -d --name kestra-dotnet-smoke -p 127.0.0.1:8080:8080 \
            -e KESTRA_CONFIGURATION="$configuration" \
            kestra/kestra:v1.3.40-slim server local
          for attempt in $(seq 1 36); do
            if ! docker inspect -f '{{.State.Running}}' kestra-dotnet-smoke 2>/dev/null | grep -qx true; then
              docker logs kestra-dotnet-smoke || true; exit 1
            fi
            if curl --location --fail --silent http://127.0.0.1:8080/ >/dev/null; then echo "Kestra API is ready."; exit 0; fi
            sleep 5
          done
          echo "Kestra API did not become ready."; docker logs kestra-dotnet-smoke || true; exit 1

      - name: Import .NET toolchain flow and require SUCCESS with observed results
        shell: bash
        run: |
          set -euo pipefail
          auth="admin@kestra.io:$KESTRA_TEST_PASSWORD"
          curl --fail --silent --show-error --user "$auth" -X POST -H "Content-Type: application/x-yaml" \
            --data-binary @toolchains/dotnet/kestra/dotnet_toolchain_smoke.yaml \
            http://127.0.0.1:8080/api/v1/main/flows -o /tmp/kestra-dotnet-import.json
          jq -e '.id == "dotnet_toolchain_smoke" and .namespace == "gordus_hub.toolchains"' /tmp/kestra-dotnet-import.json
          response="$(curl --fail --silent --show-error --user "$auth" -X POST \
            -F "sdk_version=$SDK_VERSION_LINE" -F "runtime_version=$RUNTIME_VERSION_LINE" \
            -F "hola_output=$HOLA_OUTPUT" -F "test_result=$TEST_RESULT" \
            -F "smoke_result=$SMOKE_RESULT" \
            http://127.0.0.1:8080/api/v1/main/executions/gordus_hub.toolchains/dotnet_toolchain_smoke)"
          execution_id="$(printf '%s' "$response" | jq -r '.id // empty')"
          test -n "$execution_id"
          for attempt in $(seq 1 60); do
            status_json="$(curl --fail --silent --show-error --user "$auth" "http://127.0.0.1:8080/api/v1/main/executions/$execution_id")"
            state="$(printf '%s' "$status_json" | jq -r '.state.current // empty')"
            echo ".NET toolchain execution $execution_id state: $state"
            case "$state" in
              SUCCESS) exit 0 ;;
              FAILED|WARNING|KILLING|KILLED|CANCELLED) echo "$status_json"; exit 1 ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for .NET toolchain flow execution $execution_id."; exit 1

      - name: Upload .NET toolchain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-toolchain-evidence
          path: ${{ runner.temp }}/dotnet-evidence
          if-no-files-found: warn

      - name: Print Kestra logs on failure
        if: failure()
        run: docker logs kestra-dotnet-smoke || true

      - name: Stop ephemeral Kestra engine
        if: always()
        run: docker rm -f kestra-dotnet-smoke || true
