name: Kestra static validation

on:
  pull_request:
    paths:
      - "kestra/**/*.yml"
      - "kestra/**/*.yaml"
      - ".github/workflows/kestra-static-validation.yml"
  push:
    branches:
      - main
      - "feat/kestra-github-bootstrap"
    paths:
      - "kestra/**/*.yml"
      - "kestra/**/*.yaml"
      - ".github/workflows/kestra-static-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kestra-static-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static YAML and flow structure
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Parse Kestra flow YAML and check required fields
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          import yaml

          root = Path("kestra/flows")
          files = sorted([*root.rglob("*.yaml"), *root.rglob("*.yml")]) if root.exists() else []
          if not files:
              print("ERROR: no Kestra flow YAML files found under kestra/flows")
              sys.exit(1)

          required = ("id", "namespace", "tasks")
          failed = False
          for path in files:
              file_failed = False
              try:
                  data = yaml.safe_load(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  print(f"ERROR: {path}: YAML parse failed: {exc}")
                  failed = True
                  continue

              if not isinstance(data, dict):
                  print(f"ERROR: {path}: top-level YAML value must be a mapping")
                  failed = True
                  continue

              missing = [key for key in required if key not in data]
              if missing:
                  print(f"ERROR: {path}: missing required field(s): {', '.join(missing)}")
                  failed = True
                  file_failed = True

              if "id" in data and (not isinstance(data["id"], str) or not data["id"].strip()):
                  print(f"ERROR: {path}: id must be a non-empty string")
                  failed = True
                  file_failed = True
              if "namespace" in data and (not isinstance(data["namespace"], str) or not data["namespace"].strip()):
                  print(f"ERROR: {path}: namespace must be a non-empty string")
                  failed = True
                  file_failed = True
              if "tasks" in data:
                  tasks = data["tasks"]
                  if not isinstance(tasks, list) or not tasks:
                      print(f"ERROR: {path}: tasks must be a non-empty list")
                      failed = True
                      file_failed = True
                  else:
                      for index, task in enumerate(tasks):
                          if not isinstance(task, dict):
                              print(f"ERROR: {path}: task #{index + 1} must be a mapping")
                              failed = True
                              file_failed = True
                              continue
                          for field in ("id", "type"):
                              value = task.get(field)
                              if not isinstance(value, str) or not value.strip():
                                  print(f"ERROR: {path}: task #{index + 1} requires a non-empty string '{field}'")
                                  failed = True
                                  file_failed = True

              print(f"{'FAIL' if file_failed else 'OK'}: {path}")

          if failed:
              sys.exit(1)
          print(f"Validated {len(files)} Kestra flow file(s) structurally.")
          print("Note: this is static validation; it does not run a Kestra engine or execute flows.")
          PY
