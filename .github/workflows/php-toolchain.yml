name: PHP toolchain validation

on:
  pull_request:
    paths:
      - "toolchains/php/**"
      - ".github/workflows/php-toolchain.yml"
  push:
    branches: ["main"]
    paths:
      - "toolchains/php/**"
      - ".github/workflows/php-toolchain.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: php-toolchain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pins-preflight:
    name: Validate PHP pins, signatures, security floor and isolation (fail-closed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13 (stdlib only, for the validator)
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate components.json against Dockerfile pins
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/php-evidence"
          python toolchains/php/scripts/validate_php_toolchain.py --repo-root . --report "$RUNNER_TEMP/php-evidence/php-preflight.json"
          python -c 'import json, os; p=json.load(open(os.environ["RUNNER_TEMP"] + "/php-evidence/php-preflight.json")); assert p["result"] == "PASS", p; assert p["certification"] == "NOT_GRANTED"'
          sh -n toolchains/php/tests/test_php_toolchain.sh

  image-smoke-and-kestra:
    name: Build Debian 13 PHP image, php/composer/phpunit, gate in Kestra
    needs: pins-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build isolated PHP toolchain image (checksums + GPG verified inside)
        run: docker build --pull --file toolchains/php/Dockerfile --tag gordus-php:ci .

      - name: Run php -l, composer validate/install, php and phpunit inside the image (offline)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/php-evidence"
          docker run --rm --network none gordus-php:ci sh /opt/gordus-php/tests/test_php_toolchain.sh | tee "$RUNNER_TEMP/php-evidence/smoke.txt"
          docker run --rm gordus-php:ci sh -c 'test "$(id -un)" = phpuser && test "$COMPOSER_DISABLE_NETWORK" = 1 && php -r "exit(PHP_VERSION_ID >= 80512 ? 0 : 3);" && ! command -v python3 && ! command -v curl && ! command -v php-cgi && ! command -v php-fpm && ! touch /opt/gordus-php/probe 2>/dev/null && ! touch /opt/php/probe 2>/dev/null'
          docker image inspect gordus-php:ci --format '{{.Size}}' > "$RUNNER_TEMP/php-evidence/image-size-bytes.txt"
          smoke="$RUNNER_TEMP/php-evidence/smoke.txt"
          {
            printf 'PHP_VERSION_LINE=%s\n' "$(grep -m1 '^php [0-9]' "$smoke")"
            if grep -q '^parche de seguridad (>= 8.5.12): OK' "$smoke"; then echo 'SECURITY_PATCH=PASS'; else echo 'SECURITY_PATCH=FAIL'; fi
            printf 'COMPOSER_VERSION_LINE=%s\n' "$(grep -m1 '^composer [0-9]' "$smoke")"
            printf 'PHPUNIT_VERSION_LINE=%s\n' "$(grep -m1 '^phpunit [0-9]' "$smoke")"
            printf 'HOLA_OUTPUT=%s\n' "$(grep -m1 '^Hola, ' "$smoke")"
            if grep -q '^phpunit OK' "$smoke"; then echo 'TEST_RESULT=PASS'; else echo 'TEST_RESULT=FAIL'; fi
            if grep -q '^PASS: toolchain PHP ' "$smoke"; then echo 'SMOKE_RESULT=PASS'; else echo 'SMOKE_RESULT=FAIL'; fi
          } >> "$GITHUB_ENV"

      - name: Generate a one-run Kestra test credential
        shell: bash
        run: |
          set -euo pipefail
          password="KCI$(openssl rand -hex 24)A9!"
          echo "::add-mask::$password"
          printf 'KESTRA_TEST_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"

      - name: Start ephemeral pinned Kestra engine
        shell: bash
        run: |
          set -euo pipefail
          docker pull kestra/kestra:v1.3.40-slim
          configuration="$(printf 'kestra:\n  server:\n    basicAuth:\n      username: "admin@kestra.io"\n      password: "%s"\n' "$KESTRA_TEST_PASSWORD")"
          docker run -d --name kestra-php-smoke -p 127.0.0.1:8080:8080 \
            -e KESTRA_CONFIGURATION="$configuration" \
            kestra/kestra:v1.3.40-slim server local
          for attempt in $(seq 1 36); do
            if ! docker inspect -f '{{.State.Running}}' kestra-php-smoke 2>/dev/null | grep -qx true; then
              docker logs kestra-php-smoke || true; exit 1
            fi
            if curl --location --fail --silent http://127.0.0.1:8080/ >/dev/null; then echo "Kestra API is ready."; exit 0; fi
            sleep 5
          done
          echo "Kestra API did not become ready."; docker logs kestra-php-smoke || true; exit 1

      - name: Import PHP toolchain flow and require SUCCESS with observed results
        shell: bash
        run: |
          set -euo pipefail
          auth="admin@kestra.io:$KESTRA_TEST_PASSWORD"
          curl --fail --silent --show-error --user "$auth" -X POST -H "Content-Type: application/x-yaml" \
            --data-binary @toolchains/php/kestra/php_toolchain_smoke.yaml \
            http://127.0.0.1:8080/api/v1/main/flows -o /tmp/kestra-php-import.json
          jq -e '.id == "php_toolchain_smoke" and .namespace == "gordus_hub.toolchains"' /tmp/kestra-php-import.json
          response="$(curl --fail --silent --show-error --user "$auth" -X POST \
            -F "php_version=$PHP_VERSION_LINE" -F "security_patch=$SECURITY_PATCH" \
            -F "composer_version=$COMPOSER_VERSION_LINE" -F "phpunit_version=$PHPUNIT_VERSION_LINE" \
            -F "hola_output=$HOLA_OUTPUT" -F "test_result=$TEST_RESULT" -F "smoke_result=$SMOKE_RESULT" \
            http://127.0.0.1:8080/api/v1/main/executions/gordus_hub.toolchains/php_toolchain_smoke)"
          execution_id="$(printf '%s' "$response" | jq -r '.id // empty')"
          test -n "$execution_id"
          for attempt in $(seq 1 60); do
            status_json="$(curl --fail --silent --show-error --user "$auth" "http://127.0.0.1:8080/api/v1/main/executions/$execution_id")"
            state="$(printf '%s' "$status_json" | jq -r '.state.current // empty')"
            echo "PHP toolchain execution $execution_id state: $state"
            case "$state" in
              SUCCESS) exit 0 ;;
              FAILED|WARNING|KILLING|KILLED|CANCELLED) echo "$status_json"; exit 1 ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for PHP toolchain flow execution $execution_id."; exit 1

      - name: Upload PHP toolchain evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: php-toolchain-evidence
          path: ${{ runner.temp }}/php-evidence
          if-no-files-found: warn

      - name: Print Kestra logs on failure
        if: failure()
        run: docker logs kestra-php-smoke || true

      - name: Stop ephemeral Kestra engine
        if: always()
        run: docker rm -f kestra-php-smoke || true
