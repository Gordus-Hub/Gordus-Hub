name: Kestra runtime smoke test

on:
  pull_request:
    paths:
      - "kestra/flows/**/*.yml"
      - "kestra/flows/**/*.yaml"
      - ".github/workflows/kestra-runtime-smoke-test.yml"
  push:
    branches:
      - main
    paths:
      - "kestra/flows/**/*.yml"
      - "kestra/flows/**/*.yaml"
      - ".github/workflows/kestra-runtime-smoke-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kestra-runtime-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kestra-runtime:
    name: Start Kestra and execute repository flow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Pull pinned Kestra image
        run: docker pull kestra/kestra:1.3.42

      - name: Start ephemeral Kestra engine with repository flows
        run: |
          set -euo pipefail
          docker run -d --rm --name kestra-smoke \
            -p 127.0.0.1:8080:8080 \
            -v "${{ github.workspace }}/kestra/flows:/flows:ro" \
            kestra/kestra:1.3.42 server local --flow-path /flows

      - name: Wait for Kestra API and verify flow is loaded
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/main/flows/gordus_hub.github/repository_health_check >/tmp/kestra-flow.json; then
              echo "Kestra API is ready and repository flow is loaded."
              jq -e '.id == "repository_health_check" and .namespace == "gordus_hub.github"' /tmp/kestra-flow.json
              exit 0
            fi
            sleep 5
          done
          echo "Kestra did not become ready or the flow was not loaded."
          docker logs kestra-smoke || true
          exit 1

      - name: Trigger the flow and require a successful execution
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error -X POST \
            http://127.0.0.1:8080/api/v1/main/executions/gordus_hub.github/repository_health_check)"
          echo "$response"
          execution_id="$(printf '%s' "$response" | jq -r '.id // empty')"
          if [ -z "$execution_id" ]; then
            echo "Kestra did not return an execution ID."
            exit 1
          fi

          for attempt in $(seq 1 60); do
            status_json="$(curl --fail --silent --show-error \
              "http://127.0.0.1:8080/api/v1/main/executions/$execution_id")"
            state="$(printf '%s' "$status_json" | jq -r '.state.current // empty')"
            echo "Execution $execution_id state: $state"
            case "$state" in
              SUCCESS)
                jq -e '.state.current == "SUCCESS"' <<<"$status_json"
                exit 0
                ;;
              FAILED|WARNING|KILLING|KILLED|CANCELLED)
                echo "$status_json"
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for Kestra execution $execution_id."
          exit 1

      - name: Print Kestra logs on failure
        if: failure()
        run: docker logs kestra-smoke || true

      - name: Stop ephemeral Kestra engine
        if: always()
        run: docker rm -f kestra-smoke || true
