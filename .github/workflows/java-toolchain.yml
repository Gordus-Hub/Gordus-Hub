name: Java toolchain (JDK 25) validation

on:
  pull_request:
    paths:
      - "toolchains/java/**"
      - ".github/workflows/java-toolchain.yml"
  push:
    branches: ["main"]
    paths:
      - "toolchains/java/**"
      - ".github/workflows/java-toolchain.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-toolchain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pins-preflight:
    name: Validate JDK 25 pins and isolation (fail-closed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13 (stdlib only, for the validator)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate components.json against Dockerfile pins
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/java-evidence"
          python toolchains/java/scripts/validate_java_toolchain.py --repo-root . --report "$RUNNER_TEMP/java-evidence/java-preflight.json"
          python -c 'import json, os; p=json.load(open(os.environ["RUNNER_TEMP"] + "/java-evidence/java-preflight.json")); assert p["result"] == "PASS", p; assert p["certification"] == "NOT_GRANTED"'
          sh -n toolchains/java/tests/test_java_toolchain.sh

  image-smoke-and-kestra:
    name: Build Debian 13 JDK 25 image, run javac/java, gate in Kestra
    needs: pins-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build isolated Java toolchain image (SHA-256 verified inside)
        run: docker build --pull --file toolchains/java/Dockerfile --tag gordus-java25:ci .

      - name: Run javac + java smoke test inside the image
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/java-evidence"
          docker run --rm gordus-java25:ci sh /opt/gordus-java/tests/test_java_toolchain.sh | tee "$RUNNER_TEMP/java-evidence/smoke.txt"
          docker run --rm gordus-java25:ci sh -c 'test "$(id -un)" = java && test "$JAVA_HOME" = /opt/java/jdk-25 && ! command -v python3 && ! touch /opt/gordus-java/probe 2>/dev/null'
          {
            printf 'JAVA_VERSION_LINE=%s\n' "$(docker run --rm gordus-java25:ci java -version 2>&1 | head -n 1)"
            printf 'JAVAC_VERSION_LINE=%s\n' "$(docker run --rm gordus-java25:ci javac -version 2>&1)"
            printf 'HOLA_OUTPUT=%s\n' "$(grep -m1 '^Hola, ' "$RUNNER_TEMP/java-evidence/smoke.txt")"
            if grep -q '^PASS: toolchain Java 25' "$RUNNER_TEMP/java-evidence/smoke.txt"; then echo 'SMOKE_RESULT=PASS'; else echo 'SMOKE_RESULT=FAIL'; fi
          } >> "$GITHUB_ENV"

      - name: Generate a one-run Kestra test credential
        shell: bash
        run: |
          set -euo pipefail
          password="KCI$(openssl rand -hex 24)A9!"
          echo "::add-mask::$password"
          printf 'KESTRA_TEST_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"

      - name: Start ephemeral pinned Kestra engine
        shell: bash
        run: |
          set -euo pipefail
          docker pull kestra/kestra:v1.3.40-slim
          configuration="$(printf 'kestra:\n  server:\n    basicAuth:\n      username: "admin@kestra.io"\n      password: "%s"\n' "$KESTRA_TEST_PASSWORD")"
          docker run -d --name kestra-java-smoke -p 127.0.0.1:8080:8080 \
            -e KESTRA_CONFIGURATION="$configuration" \
            kestra/kestra:v1.3.40-slim server local
          for attempt in $(seq 1 36); do
            if ! docker inspect -f '{{.State.Running}}' kestra-java-smoke 2>/dev/null | grep -qx true; then
              docker logs kestra-java-smoke || true; exit 1
            fi
            if curl --location --fail --silent http://127.0.0.1:8080/ >/dev/null; then echo "Kestra API is ready."; exit 0; fi
            sleep 5
          done
          echo "Kestra API did not become ready."; docker logs kestra-java-smoke || true; exit 1

      - name: Import Java toolchain flow and require SUCCESS with observed results
        shell: bash
        run: |
          set -euo pipefail
          auth="admin@kestra.io:$KESTRA_TEST_PASSWORD"
          curl --fail --silent --show-error --user "$auth" -X POST -H "Content-Type: application/x-yaml" \
            --data-binary @toolchains/java/kestra/java_toolchain_smoke.yaml \
            http://127.0.0.1:8080/api/v1/main/flows -o /tmp/kestra-java-import.json
          jq -e '.id == "java_toolchain_smoke" and .namespace == "gordus_hub.toolchains"' /tmp/kestra-java-import.json
          response="$(curl --fail --silent --show-error --user "$auth" -X POST \
            -F "java_version_line=$JAVA_VERSION_LINE" -F "javac_version_line=$JAVAC_VERSION_LINE" \
            -F "hola_output=$HOLA_OUTPUT" -F "smoke_result=$SMOKE_RESULT" \
            http://127.0.0.1:8080/api/v1/main/executions/gordus_hub.toolchains/java_toolchain_smoke)"
          execution_id="$(printf '%s' "$response" | jq -r '.id // empty')"
          test -n "$execution_id"
          for attempt in $(seq 1 60); do
            status_json="$(curl --fail --silent --show-error --user "$auth" "http://127.0.0.1:8080/api/v1/main/executions/$execution_id")"
            state="$(printf '%s' "$status_json" | jq -r '.state.current // empty')"
            echo "Java toolchain execution $execution_id state: $state"
            case "$state" in
              SUCCESS) exit 0 ;;
              FAILED|WARNING|KILLING|KILLED|CANCELLED) echo "$status_json"; exit 1 ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for Java toolchain flow execution $execution_id."; exit 1

      - name: Upload Java toolchain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-toolchain-evidence
          path: ${{ runner.temp }}/java-evidence
          if-no-files-found: warn

      - name: Print Kestra logs on failure
        if: failure()
        run: docker logs kestra-java-smoke || true

      - name: Stop ephemeral Kestra engine
        if: always()
        run: docker rm -f kestra-java-smoke || true
