; Gordus-Hub - ajustes de seguridad de PHP (se cargan despues de php.ini-production).
; Mitigaciones recomendadas por php.net (avisos del 21/10/2026 y 23/10/2026) ademas del parche:
session.upload_progress.enabled = 0
fatal_error_backtraces = 0
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
allow_url_include = Off
memory_limit = 256M
post_max_size = 8M
upload_max_filesize = 2M
zend.assertions = 1
