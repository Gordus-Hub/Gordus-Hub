id: scala_toolchain_smoke
namespace: gordus_hub.toolchains
description: >
  Fail-closed gate for the isolated Scala 3 toolchain (toolchains/scala/).
  The Kestra slim image ships only core plugins and no Scala compiler, so scalac and
  scala-cli (run / package) and the test program run inside the gordus-scala Debian 13
  image (offline, with its own JDK 25); this flow receives the observed results as inputs
  and FAILS unless they prove Scala 3.10.0 on JDK 25. Kept apart from kestra/flows/ and
  the other toolchain flows.
inputs:
  - id: scalac_version_line
    type: STRING
    defaults: "NOT_PROVIDED"
  - id: java_version_line
    type: STRING
    defaults: "NOT_PROVIDED"
  - id: hola_output
    type: STRING
    defaults: "NOT_PROVIDED"
  - id: test_result
    type: STRING
    defaults: "NOT_PROVIDED"
  - id: smoke_result
    type: STRING
    defaults: "NOT_PROVIDED"
tasks:
  - id: declare_scala_boundary
    type: io.kestra.plugin.core.log.Log
    message: >
      TOOLCHAIN=SCALA;
      SCALA=3.10.0_SCALA3_GITHUB_SHA256_PINNED_AMD64_ARM64;
      SCALA_CLI=BUNDLED_1.17.1_OFFLINE_LOCAL_REPOSITORY;
      JDK=ECLIPSE_TEMURIN_25.0.5+8_SHA256_AND_GPG_PINNED_AMD64_ARM64;
      JAVA_HOME=/OPT/SCALA/JDK-25;
      TOOLS=SCALAC,SCALA_RUN,SCALA_PACKAGE,SCALADOC,JAVA;
      SBT=NOT_INCLUDED;
      OFFLINE=TRUE;
      IMAGE_BASE=DEBIAN_13_SLIM;
      ISOLATED_FROM=AI_PYTHON,SCRIPTS_AI,JAVA,KOTLIN,MOJO,GO,CPP,RUST,NODE,DOTNET,SWIFT,DEVCONTAINER_JDK21;
      LICENSE=APACHE-2.0;
      CERTIFICATION=NOT_GRANTED.
  - id: gate_scala_smoke
    type: io.kestra.plugin.core.flow.If
    condition: "{{ (inputs.scalac_version_line contains 'Scala compiler version 3.10.0 ') and (inputs.java_version_line contains 'version \"25') and (inputs.hola_output contains 'Hola, Gordus-Hub!') and (inputs.test_result == 'PASS') and (inputs.smoke_result == 'PASS') }}"
    then:
      - id: record_pass
        type: io.kestra.plugin.core.log.Log
        message: "SCALA_TOOLCHAIN_SMOKE=PASS; scalac='{{ inputs.scalac_version_line }}'; java='{{ inputs.java_version_line }}'; output='{{ inputs.hola_output }}'"
    else:
      - id: fail_closed
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "SCALA_TOOLCHAIN_SMOKE=BLOCKED: results missing or not Scala 3.10.0 on JDK 25 (scalac='{{ inputs.scalac_version_line }}', java='{{ inputs.java_version_line }}', smoke='{{ inputs.smoke_result }}')"
