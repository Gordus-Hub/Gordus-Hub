id: kotlin_toolchain_smoke
namespace: gordus_hub.toolchains
description: >
  Fail-closed gate for the isolated Kotlin toolchain (toolchains/kotlin/).
  The Kestra slim image ships only core plugins and no Kotlin compiler, so kotlinc,
  java -jar, the kotlin runner and the kotlin.test checks run inside the gordus-kotlin
  Debian 13 image (offline, with its own JDK 25); this flow receives the observed results
  as inputs and FAILS unless they prove Kotlin 2.4.21 on JDK 25. Kept apart from
  kestra/flows/ and the other toolchain flows.
inputs:
  - id: kotlinc_version_line
    type: STRING
    defaults: "NOT_PROVIDED"
  - id: java_version_line
    type: STRING
    defaults: "NOT_PROVIDED"
  - id: hola_output
    type: STRING
    defaults: "NOT_PROVIDED"
  - id: test_result
    type: STRING
    defaults: "NOT_PROVIDED"
  - id: smoke_result
    type: STRING
    defaults: "NOT_PROVIDED"
tasks:
  - id: declare_kotlin_boundary
    type: io.kestra.plugin.core.log.Log
    message: >
      TOOLCHAIN=KOTLIN;
      KOTLIN=2.4.21_JETBRAINS_GITHUB_SHA256_PINNED;
      JDK=ECLIPSE_TEMURIN_25.0.5+8_SHA256_AND_GPG_PINNED_AMD64_ARM64;
      JAVA_HOME=/OPT/KOTLIN/JDK-25;
      TOOLS=KOTLINC,KOTLIN,JAVA,JAR,KOTLIN_TEST;
      GRADLE=NOT_INCLUDED;
      OFFLINE=TRUE;
      IMAGE_BASE=DEBIAN_13_SLIM;
      ISOLATED_FROM=AI_PYTHON,SCRIPTS_AI,JAVA,SCALA,MOJO,GO,CPP,RUST,NODE,DOTNET,SWIFT,DEVCONTAINER_JDK21;
      LICENSE=APACHE-2.0;
      CERTIFICATION=NOT_GRANTED.
  - id: gate_kotlin_smoke
    type: io.kestra.plugin.core.flow.If
    condition: "{{ (inputs.kotlinc_version_line contains 'kotlinc-jvm 2.4.21 ') and (inputs.java_version_line contains 'version \"25') and (inputs.hola_output contains 'Hola, Gordus-Hub!') and (inputs.test_result == 'PASS') and (inputs.smoke_result == 'PASS') }}"
    then:
      - id: record_pass
        type: io.kestra.plugin.core.log.Log
        message: "KOTLIN_TOOLCHAIN_SMOKE=PASS; kotlinc='{{ inputs.kotlinc_version_line }}'; java='{{ inputs.java_version_line }}'; output='{{ inputs.hola_output }}'"
    else:
      - id: fail_closed
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "KOTLIN_TOOLCHAIN_SMOKE=BLOCKED: results missing or not Kotlin 2.4.21 on JDK 25 (kotlinc='{{ inputs.kotlinc_version_line }}', java='{{ inputs.java_version_line }}', smoke='{{ inputs.smoke_result }}')"
