id: cpp_toolchain_smoke
namespace: gordus_hub.toolchains
description: >
  Fail-closed gate for the isolated C++23 toolchain (toolchains/cpp/).
  The Kestra slim image ships only core plugins and no C++ compiler, so g++ / clang++ /
  cmake / ninja run inside the gordus-cpp Debian 13 image; this flow receives the observed
  results as inputs and FAILS unless they prove g++ 14.2.0, clang++ 19.1.7, the C++23
  example output and import std. Kept apart from kestra/flows/ and the other toolchain flows.
inputs:
  - id: gcc_version
    type: STRING
    defaults: "NOT_PROVIDED"
  - id: clang_version
    type: STRING
    defaults: "NOT_PROVIDED"
  - id: hola_output
    type: STRING
    defaults: "NOT_PROVIDED"
  - id: import_std_result
    type: STRING
    defaults: "NOT_PROVIDED"
  - id: smoke_result
    type: STRING
    defaults: "NOT_PROVIDED"
tasks:
  - id: declare_cpp_boundary
    type: io.kestra.plugin.core.log.Log
    message: >
      TOOLCHAIN=CPP;
      STANDARD=CPP23_202302L;
      GCC=14.2.0-19_DEBIAN_TRIXIE_APT_PINNED;
      CLANG=19.1.7-3+B1_DEBIAN_TRIXIE_APT_PINNED;
      STDLIB=LIBSTDCXX_14,LIBCXX_19;
      LINKERS=GNU_LD_2.44_DEFAULT,LLD_19;
      BUILD=CMAKE_3.31.6,NINJA_1.12.1,MAKE_4.4.1;
      IMAGE_BASE=DEBIAN_13_SLIM;
      PYTHON_IN_IMAGE=NO;
      ISOLATED_FROM=AI_PYTHON,SCRIPTS_AI,JAVA_TOOLCHAIN,MOJO_TOOLCHAIN,GO_TOOLCHAIN,DEVCONTAINER;
      LICENSE=GPL-3.0_WITH_GCC_RUNTIME_EXCEPTION,APACHE-2.0_WITH_LLVM_EXCEPTION;
      CERTIFICATION=NOT_GRANTED.
  - id: gate_cpp_smoke
    type: io.kestra.plugin.core.flow.If
    condition: "{{ (inputs.gcc_version == 'g++ 14.2.0') and (inputs.clang_version == 'clang++ 19.1.7') and (inputs.hola_output contains 'Hola, Gordus-Hub!') and (inputs.import_std_result == 'PASS') and (inputs.smoke_result == 'PASS') }}"
    then:
      - id: record_pass
        type: io.kestra.plugin.core.log.Log
        message: "CPP_TOOLCHAIN_SMOKE=PASS; gcc='{{ inputs.gcc_version }}'; clang='{{ inputs.clang_version }}'; output='{{ inputs.hola_output }}'"
    else:
      - id: fail_closed
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "CPP_TOOLCHAIN_SMOKE=BLOCKED: results missing or wrong versions (gcc='{{ inputs.gcc_version }}', clang='{{ inputs.clang_version }}', import_std='{{ inputs.import_std_result }}', smoke='{{ inputs.smoke_result }}')"
