id: swift_toolchain_smoke
namespace: gordus_hub.toolchains
description: >
  Fail-closed gate for the isolated Swift toolchain (toolchains/swift/).
  The Kestra slim image ships only core plugins and no Swift toolchain, so swiftc and
  swift build / run / test run inside the gordus-swift Debian 13 image; this flow receives
  the observed results as inputs and FAILS unless they prove Swift 6.4.1 offline.
  Kept apart from kestra/flows/ and the other toolchain flows.
inputs:
  - id: swiftc_version_line
    type: STRING
    defaults: "NOT_PROVIDED"
  - id: swiftpm_version_line
    type: STRING
    defaults: "NOT_PROVIDED"
  - id: hola_output
    type: STRING
    defaults: "NOT_PROVIDED"
  - id: test_result
    type: STRING
    defaults: "NOT_PROVIDED"
  - id: smoke_result
    type: STRING
    defaults: "NOT_PROVIDED"
tasks:
  - id: declare_swift_boundary
    type: io.kestra.plugin.core.log.Log
    message: >
      TOOLCHAIN=SWIFT;
      SWIFT=6.4.1_SWIFT_ORG_DEBIAN13_SHA256_AND_GPG_PINNED_AMD64_ARM64;
      TOOLS=SWIFTC,SWIFT_BUILD,SWIFT_RUN,SWIFT_TEST,SWIFT_PACKAGE;
      SWIFTLY=NOT_USED;
      LLDB=REMOVED_NO_PYTHON;
      INSTALL=/OPT/SWIFT;
      CACHE=/VAR/LIB/GORDUS-SWIFT;
      OFFLINE=TRUE;
      IMAGE_BASE=DEBIAN_13_SLIM;
      ISOLATED_FROM=AI_PYTHON,SCRIPTS_AI,JAVA,MOJO,GO,CPP,RUST,NODE,DOTNET,DEVCONTAINER;
      LICENSE=APACHE-2.0_WITH_RUNTIME_LIBRARY_EXCEPTION;
      CERTIFICATION=NOT_GRANTED.
  - id: gate_swift_smoke
    type: io.kestra.plugin.core.flow.If
    condition: "{{ (inputs.swiftc_version_line contains 'Swift version 6.4.1 (') and (inputs.swiftpm_version_line contains 'Swift 6.4.1') and (inputs.hola_output contains 'Hola, Gordus-Hub!') and (inputs.test_result == 'PASS') and (inputs.smoke_result == 'PASS') }}"
    then:
      - id: record_pass
        type: io.kestra.plugin.core.log.Log
        message: "SWIFT_TOOLCHAIN_SMOKE=PASS; swiftc='{{ inputs.swiftc_version_line }}'; swiftpm='{{ inputs.swiftpm_version_line }}'; output='{{ inputs.hola_output }}'"
    else:
      - id: fail_closed
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "SWIFT_TOOLCHAIN_SMOKE=BLOCKED: results missing or not Swift 6.4.1 (swiftc='{{ inputs.swiftc_version_line }}', swiftpm='{{ inputs.swiftpm_version_line }}', smoke='{{ inputs.smoke_result }}')"
