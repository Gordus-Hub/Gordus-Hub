id: dotnet_toolchain_smoke
namespace: gordus_hub.toolchains
description: >
  Fail-closed gate for the isolated .NET 10 SDK / C# toolchain (toolchains/dotnet/).
  The Kestra slim image ships only core plugins and no .NET SDK for this project, so
  dotnet restore / build / run / self-check run inside the gordus-dotnet Debian 13 image; this
  flow receives the observed results as inputs and FAILS unless they prove .NET SDK 10.0.402
  (runtime 10.0.13) offline. Kept apart from kestra/flows/ and the other flows.
inputs:
  - id: sdk_version
    type: STRING
    defaults: "NOT_PROVIDED"
  - id: runtime_version
    type: STRING
    defaults: "NOT_PROVIDED"
  - id: hola_output
    type: STRING
    defaults: "NOT_PROVIDED"
  - id: test_result
    type: STRING
    defaults: "NOT_PROVIDED"
  - id: smoke_result
    type: STRING
    defaults: "NOT_PROVIDED"
tasks:
  - id: declare_dotnet_boundary
    type: io.kestra.plugin.core.log.Log
    message: >
      TOOLCHAIN=DOTNET_CSHARP;
      DOTNET_SDK=10.0.402_LTS_MICROSOFT_OFFICIAL_SHA512_PINNED_AMD64_ARM64;
      DOTNET_RUNTIME=10.0.13;
      CSHARP=14.0;
      NUGET_REMOTE_SOURCES=NONE;
      RESTORE_LOCKED_MODE=TRUE;
      TELEMETRY=OFF;
      IMAGE_BASE=DEBIAN_13_SLIM;
      ISOLATED_FROM=AI_PYTHON,SCRIPTS_AI,JAVA_TOOLCHAIN,MOJO_TOOLCHAIN,GO_TOOLCHAIN,CPP_TOOLCHAIN,RUST_TOOLCHAIN,NODE_TOOLCHAIN,SWIFT_TOOLCHAIN,DEVCONTAINER;
      LICENSE=MIT;
      CERTIFICATION=NOT_GRANTED.
  - id: gate_dotnet_smoke
    type: io.kestra.plugin.core.flow.If
    condition: "{{ (inputs.sdk_version == 'dotnet sdk 10.0.402') and (inputs.runtime_version == 'dotnet runtime 10.0.13') and (inputs.hola_output contains 'Hola, Gordus-Hub!') and (inputs.test_result == 'PASS') and (inputs.smoke_result == 'PASS') }}"
    then:
      - id: record_pass
        type: io.kestra.plugin.core.log.Log
        message: "DOTNET_TOOLCHAIN_SMOKE=PASS; sdk='{{ inputs.sdk_version }}'; runtime='{{ inputs.runtime_version }}'"
    else:
      - id: fail_closed
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "DOTNET_TOOLCHAIN_SMOKE=BLOCKED: results missing or wrong versions (sdk='{{ inputs.sdk_version }}', runtime='{{ inputs.runtime_version }}', smoke='{{ inputs.smoke_result }}')"
